name: Merge VLESS Configs

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  merge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get install -y jq curl

      - name: Write helper script
        run: |
          cat > /tmp/build.sh << 'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail

          GROUP_SIZE=20
          OUTPUT_DIR="configs"
          VLESS_TXT="vlees.txt"
          mkdir -p "$OUTPUT_DIR"

          printf '#profile-title: HiBypass | LTE FREE 🏳🇷🇺\n' > "$VLESS_TXT"
          printf '#profile-update-interval: 6\n'                 >> "$VLESS_TXT"
          printf '#support-url: https://t.me/Hibypass\n'         >> "$VLESS_TXT"
          printf '#profile-web-page-url: https://t.me/Hibypass\n' >> "$VLESS_TXT"
          printf '#traffic-limit: ∞\n'                           >> "$VLESS_TXT"
          printf '#traffic-remaining: ∞\n'                       >> "$VLESS_TXT"

          # ---------- парсим vless:// URI ----------
          parse_vless() {
            local uri="$1"
            local body="${uri#vless://}"
            local uuid="${body%%@*}"
            local rest="${body#*@}"
            local hostport="${rest%%\?*}"
            local host="${hostport%%:*}"
            local port="${hostport##*:}"
            local params="${rest#*\?}"
            params="${params%%#*}"

            local flow sni pbk fp sid net
            flow=$(printf '%s' "$params" | tr '&' '\n' | grep '^flow=' | cut -d= -f2 | head -1)
            sni=$( printf '%s' "$params" | tr '&' '\n' | grep '^sni='  | cut -d= -f2 | head -1)
            pbk=$( printf '%s' "$params" | tr '&' '\n' | grep '^pbk='  | cut -d= -f2 | head -1)
            fp=$(  printf '%s' "$params" | tr '&' '\n' | grep '^fp='   | cut -d= -f2 | head -1)
            sid=$( printf '%s' "$params" | tr '&' '\n' | grep '^sid='  | cut -d= -f2 | head -1)
            net=$( printf '%s' "$params" | tr '&' '\n' | grep '^type=' | cut -d= -f2 | head -1)

            [ -z "$flow" ] && flow="xtls-rprx-vision"
            [ -z "$fp"   ] && fp="chrome"
            [ -z "$net"  ] && net="tcp"
            [ -z "$sni"  ] && sni="$host"
            [ -z "$sid"  ] && sid=""

            printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s' \
              "$uuid" "$host" "$port" "$flow" "$sni" "$pbk" "$fp" "$sid" "$net"
          }

          # ---------- генерируем один xray config.json ----------
          generate_config() {
            local LABEL="$1"
            local LINES_FILE="$2"
            local TAG_PREFIX="$3"
            local OUT_FILE="$4"

            local OUTBOUNDS_JSON="[]"
            local TAGS_JSON="[]"
            local idx=1

            while IFS= read -r line; do
              [ -z "$line" ] && continue

              local fields uuid host port flow sni pbk fp sid net
              fields=$(parse_vless "$line")
              uuid=$(printf '%s' "$fields" | cut -f1)
              host=$(printf '%s' "$fields" | cut -f2)
              port=$(printf '%s' "$fields" | cut -f3)
              flow=$(printf '%s' "$fields" | cut -f4)
              sni=$( printf '%s' "$fields" | cut -f5)
              pbk=$( printf '%s' "$fields" | cut -f6)
              fp=$(  printf '%s' "$fields" | cut -f7)
              sid=$( printf '%s' "$fields" | cut -f8)
              net=$( printf '%s' "$fields" | cut -f9)

              [ -z "$host" ] && continue
              [ -z "$uuid" ] && continue
              [ -z "$pbk"  ] && continue

              # порт должен быть числом
              if ! printf '%s' "$port" | grep -qE '^[0-9]+$'; then
                continue
              fi

              local tag="${TAG_PREFIX}-${idx}"

              local ob
              ob=$(jq -n \
                --arg    tag  "$tag"  \
                --arg    uuid "$uuid" \
                --arg    host "$host" \
                --argjson port "$port" \
                --arg    flow "$flow" \
                --arg    sni  "$sni"  \
                --arg    pbk  "$pbk"  \
                --arg    fp   "$fp"   \
                --arg    sid  "$sid"  \
                --arg    net  "$net"  \
              '{
                tag: $tag,
                protocol: "vless",
                settings: {
                  vnext: [{
                    address: $host,
                    port: ($port | tonumber),
                    users: [{ id: $uuid, encryption: "none", flow: $flow }]
                  }]
                },
                streamSettings: {
                  network: $net,
                  tcpSettings: {},
                  security: "reality",
                  realitySettings: {
                    serverName: $sni,
                    publicKey: $pbk,
                    shortId: $sid,
                    fingerprint: $fp
                  }
                }
              }') || continue

              OUTBOUNDS_JSON=$(printf '%s' "$OUTBOUNDS_JSON" | jq ". + [$ob]")
              TAGS_JSON=$(printf '%s' "$TAGS_JSON" | jq ". + [\"$tag\"]")
              idx=$((idx + 1))
            done < "$LINES_FILE"

            local count
            count=$(printf '%s' "$TAGS_JSON" | jq 'length')
            [ "$count" -eq 0 ] && { echo "  ⚠️  нет валидных конфигов, пропускаем"; return 0; }

            OUTBOUNDS_JSON=$(printf '%s' "$OUTBOUNDS_JSON" | jq \
              '. + [{"tag":"direct","protocol":"freedom"},{"tag":"block","protocol":"blackhole"}]')

            local balTag="AUTO-${TAG_PREFIX}"

            jq -n \
              --arg    remarks "$LABEL"  \
              --arg    balTag  "$balTag" \
              --argjson tags   "$TAGS_JSON"    \
              --argjson outs   "$OUTBOUNDS_JSON" \
            '{
              remarks: $remarks,
              dns: { servers: ["1.1.1.1","1.0.0.1"], queryStrategy: "UseIP" },
              routing: {
                domainMatcher: "hybrid",
                domainStrategy: "IPIfNonMatch",
                rules: [
                  { type: "field", protocol: ["bittorrent"], outboundTag: "direct" },
                  { type: "field", inboundTag: ["socks","http"], balancerTag: $balTag }
                ],
                balancers: [{
                  tag: $balTag,
                  selector: $tags,
                  strategy: {
                    type: "leastPing",
                    settings: { maxRTT: "2000ms", expected: 3, baselines: ["1200ms"], tolerance: 0.1 }
                  },
                  fallbackTag: "direct"
                }]
              },
              inbounds: [
                {
                  tag: "socks", port: 10808, listen: "127.0.0.1",
                  protocol: "socks",
                  settings: { udp: true, auth: "noauth" },
                  sniffing: { enabled: true, routeOnly: false, destOverride: ["http","tls","quic"] }
                },
                {
                  tag: "http", port: 10809, listen: "127.0.0.1",
                  protocol: "http",
                  settings: { allowTransparent: false },
                  sniffing: { enabled: true, routeOnly: false, destOverride: ["http","tls","quic"] }
                }
              ],
              outbounds: $outs,
              burstObservatory: {
                pingConfig: {
                  timeout: "2s", interval: "10s", sampling: 2,
                  httpMethod: "GET",
                  destination: "https://www.gstatic.com/generate_204",
                  connectivity: ""
                },
                subjectSelector: $tags
              }
            }' > "$OUT_FILE"

            echo "  ✅ $OUT_FILE  ($count конфигов)"
          }

          # ---------- источники ----------
          SOURCES=(
            "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/Vless-Reality-White-Lists-Rus-Mobile-2.txt"
            "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/Vless-Reality-White-Lists-Rus-Mobile.txt"
            "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/WHITE-CIDR-RU-all.txt"
            "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/WHITE-CIDR-RU-checked.txt"
            "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/WHITE-SNI-RU-all.txt"
            "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/BLACK_SS%2BAll_RUS.txt"
            "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/BLACK_VLESS_RUS.txt"
            "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/BLACK_VLESS_RUS_mobile.txt"
          )

          # ---------- основной цикл ----------
          BLOCK=1
          for URL in "${SOURCES[@]}"; do
            echo "📥 Блок $BLOCK: $URL"
            TMP_RAW=$(mktemp)

            curl -fsSL "$URL" \
              | grep -E '^vless://' \
              | sort -u > "$TMP_RAW" || true

            TOTAL=$(wc -l < "$TMP_RAW")
            echo "   Найдено: $TOTAL конфигов"

            if [ "$TOTAL" -eq 0 ]; then
              echo "   ⚠️  Пусто, пропускаем"
              BLOCK=$((BLOCK + 1))
              rm -f "$TMP_RAW"
              continue
            fi

            GROUP=1
            TMP_CHUNK=$(mktemp)

            while IFS= read -r line; do
              printf '%s\n' "$line" >> "$TMP_CHUNK"
              CHUNK_LEN=$(wc -l < "$TMP_CHUNK")

              if [ "$CHUNK_LEN" -ge "$GROUP_SIZE" ]; then
                LABEL="LTE | Авто ${BLOCK}.${GROUP}"
                FNAME="${OUTPUT_DIR}/lte_${BLOCK}_${GROUP}.json"
                generate_config "$LABEL" "$TMP_CHUNK" "n${BLOCK}g${GROUP}" "$FNAME"
                while IFS= read -r vline; do
                  printf '%s#🇪🇺%s\n' "${vline%%#*}" "$LABEL" >> "$VLESS_TXT"
                done < "$TMP_CHUNK"
                > "$TMP_CHUNK"
                GROUP=$((GROUP + 1))
              fi
            done < "$TMP_RAW"

            # остаток
            if [ -s "$TMP_CHUNK" ]; then
              LABEL="LTE | Авто ${BLOCK}.${GROUP}"
              FNAME="${OUTPUT_DIR}/lte_${BLOCK}_${GROUP}.json"
              generate_config "$LABEL" "$TMP_CHUNK" "n${BLOCK}g${GROUP}" "$FNAME"
              while IFS= read -r vline; do
                printf '%s#🇪🇺%s\n' "${vline%%#*}" "$LABEL" >> "$VLESS_TXT"
              done < "$TMP_CHUNK"
            fi

            rm -f "$TMP_RAW" "$TMP_CHUNK"
            BLOCK=$((BLOCK + 1))
          done

          echo ""
          echo "✅ Готово!"
          echo "   JSON конфигов : $(find "$OUTPUT_DIR" -name '*.json' | wc -l)"
          echo "   Строк vlees   : $(wc -l < "$VLESS_TXT")"
          SCRIPT
          chmod +x /tmp/build.sh

      - name: Run build script
        run: bash /tmp/build.sh

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add configs/ vlees.txt
          git diff --staged --quiet || git commit -m "Auto: обновление $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
