name: Merge VLESS Configs

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  merge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y jq curl

      - name: Convert VLESS to JSON and split by 20
        run: |
          set -euo pipefail

          # ==================== Улучшенный парсер VLESS ====================
          parse_vless() {
            local URL="$1"
            local REMARK="$2"

            # Убираем vless://
            local TEMP="${URL#vless://}"
            
            local UUID="${TEMP%%@*}"
            local REST="${TEMP#*@}"
            
            local ADDRESS="${REST%%:*}"
            local PORT_REST="${REST#*:}"
            local PORT="${PORT_REST%%[?#]*}"
            
            # Параметры после ?
            local QUERY=""
            if [[ $REST == *"?"* ]]; then
              QUERY="${REST#*\?}"
              QUERY="${QUERY%%#*}"
            fi

            # Извлекаем параметры
            local ENCRYPTION=$(echo "$QUERY" | grep -o 'encryption=[^&]*' | cut -d'=' -f2 || echo "none")
            local FLOW=$(echo "$QUERY" | grep -o 'flow=[^&]*' | cut -d'=' -f2 || echo "")
            local SECURITY=$(echo "$QUERY" | grep -o 'security=[^&]*' | cut -d'=' -f2 || echo "reality")
            local SNI=$(echo "$QUERY" | grep -o 'sni=[^&]*' | cut -d'=' -f2 || echo "$ADDRESS")
            local FP=$(echo "$QUERY" | grep -o 'fp=[^&]*' | cut -d'=' -f2 || echo "chrome")
            local PBK=$(echo "$QUERY" | grep -o 'pbk=[^&]*' | cut -d'=' -f2 || echo "")

            # Если pbk пустой — пропускаем конфиг (Reality без pbk бесполезен)
            if [[ -z "$PBK" ]]; then
              echo "Пропущен (нет pbk): $REMARK" >&2
              return 1
            fi

            jq -n \
              --arg tag "proxy" \
              --arg protocol "vless" \
              --arg address "$ADDRESS" \
              --arg port "$PORT" \
              --arg id "$UUID" \
              --arg encryption "${ENCRYPTION:-none}" \
              --arg flow "$FLOW" \
              --arg security "$SECURITY" \
              --arg sni "$SNI" \
              --arg fp "$FP" \
              --arg pbk "$PBK" \
              --arg remark "$REMARK" \
              '{
                tag: $tag,
                protocol: $protocol,
                settings: {
                  vnext: [{
                    address: $address,
                    port: ($port | tonumber),
                    users: [{
                      id: $id,
                      encryption: $encryption,
                      flow: $flow
                    }]
                  }]
                },
                streamSettings: {
                  network: "tcp",
                  security: $security,
                  realitySettings: {
                    serverName: $sni,
                    publicKey: $pbk,
                    fingerprint: $fp,
                    shortId: ""
                  }
                }
              }'
          }

          # ==================== Базовый шаблон ====================
          cat > base_config.json << 'EOF'
          {
            "dns": {
              "servers": ["1.1.1.1", "1.0.0.1"],
              "queryStrategy": "UseIP"
            },
            "routing": {
              "rules": [
                {
                  "type": "field",
                  "protocol": ["bittorrent"],
                  "outboundTag": "direct"
                }
              ],
              "domainMatcher": "hybrid",
              "domainStrategy": "IPIfNonMatch"
            },
            "inbounds": [
              {
                "tag": "socks",
                "port": 10808,
                "listen": "127.0.0.1",
                "protocol": "socks",
                "settings": { "udp": true, "auth": "noauth" },
                "sniffing": { "enabled": true, "routeOnly": false, "destOverride": ["http", "tls", "quic"] }
              },
              {
                "tag": "http",
                "port": 10809,
                "listen": "127.0.0.1",
                "protocol": "http",
                "settings": { "allowTransparent": false },
                "sniffing": { "enabled": true, "routeOnly": false, "destOverride": ["http", "tls", "quic"] }
              }
            ],
            "outbounds": [],
            "remarks": "🇪🇺 LTE | НОМЕР"
          }
          EOF

          # ==================== Обработка источника ====================
          process_source() {
            local URL="$1"
            local BLOCK_NUM="$2"
            
            echo "🔄 Обрабатываем источник $BLOCK_NUM: $URL"
            
            # Получаем и чистим ссылки
            mapfile -t ALL_CONFIGS < <(curl -fsSL "$URL" 2>/dev/null | grep -E '^vless://' | sort -u)
            
            if [[ ${#ALL_CONFIGS[@]} -eq 0 ]]; then
              echo "⚠️ Нет VLESS ссылок в источнике $BLOCK_NUM"
              return 0
            fi

            local BATCH=1
            local COUNT=0
            local CONFIGS=()

            for line in "${ALL_CONFIGS[@]}"; do
              CONFIGS+=("$line")
              COUNT=$((COUNT + 1))

              if [[ $COUNT -eq 20 ]]; then
                process_batch "$BLOCK_NUM" "\( BATCH" " \){CONFIGS[@]}"
                BATCH=$((BATCH + 1))
                CONFIGS=()
                COUNT=0
              fi
            done

            # Остаток
            if [[ ${#CONFIGS[@]} -gt 0 ]]; then
              process_batch "$BLOCK_NUM" "\( BATCH" " \){CONFIGS[@]}"
            fi
          }

          process_batch() {
            local BLOCK_NUM="$1"
            local BATCH="$2"
            shift 2
            local CONFIGS=("$@")

            local OUTPUT_FILE="lte_\( {BLOCK_NUM}_ \){BATCH}.json"
            cp base_config.json "$OUTPUT_FILE"

            local added=0
            for i in "${!CONFIGS[@]}"; do
              local REMARK="🇪🇺 LTE | \( {BLOCK_NUM}. \){BATCH} | node$((i+1))"
              
              if parse_vless "${CONFIGS[$i]}" "$REMARK" >> "$OUTPUT_FILE.tmp"; then
                added=$((added + 1))
              fi
            done

            if [[ $added -eq 0 ]]; then
              rm -f "$OUTPUT_FILE" "$OUTPUT_FILE.tmp"
              echo "❌ Блок $BLOCK_NUM.$BATCH: ничего не добавлено"
              return 0
            fi

            # Собираем outbounds
            jq -s '.[0] as $base | $base + {outbounds: (.[1:])}' "$OUTPUT_FILE" "$OUTPUT_FILE.tmp" > "$OUTPUT_FILE.new"
            mv "$OUTPUT_FILE.new" "$OUTPUT_FILE"
            rm -f "$OUTPUT_FILE.tmp"

            # Обновляем remarks
            jq --arg r "🇪🇺 LTE | \( {BLOCK_NUM}. \){BATCH} (${added} nodes)" \
              '.remarks = $r' "$OUTPUT_FILE" > "$OUTPUT_FILE.new"
            mv "$OUTPUT_FILE.new" "$OUTPUT_FILE"

            echo "✅ Создан: $OUTPUT_FILE ($added нод)"
          }

          # ==================== Запуск ====================
          rm -f lte_*.json

          process_source "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/Vless-Reality-White-Lists-Rus-Mobile-2.txt" "1"
          process_source "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/Vless-Reality-White-Lists-Rus-Mobile.txt" "2"
          process_source "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/WHITE-CIDR-RU-all.txt" "3"
          process_source "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/WHITE-CIDR-RU-checked.txt" "4"
          process_source "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/WHITE-SNI-RU-all.txt" "5"
          process_source "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/BLACK_SS%2BAll_RUS.txt" "6"
          process_source "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/BLACK_VLESS_RUS.txt" "7"
          process_source "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/BLACK_VLESS_RUS_mobile.txt" "8"

          echo "Всего создано файлов: $(ls lte_*.json 2>/dev/null | wc -l)"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          if git diff --quiet --exit-code lte_*.json 2>/dev/null; then
            echo "Нет изменений для коммита"
          else
            git add lte_*.json
            git commit -m "Auto: обновление $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
