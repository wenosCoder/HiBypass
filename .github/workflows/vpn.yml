name: Merge VLESS Configs

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  merge:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch and merge VLESS configs
        run: |
          > merged-vless.txt

          process_source() {
            local URL="$1"
            local PREFIX="$2"
            local COUNTER=1
            curl -fsSL "$URL" | grep -E '^vless://' | sort -u | while IFS= read -r line; do
              BASE=$(echo "$line" | sed 's/#.*//')
              echo "${BASE}#🇪🇺LTE | ${PREFIX}.${COUNTER}"
              COUNTER=$((COUNTER + 1))
            done
          }

          process_source "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/Vless-Reality-White-Lists-Rus-Mobile-2.txt" "1" >> merged-vless.txt
          process_source "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/Vless-Reality-White-Lists-Rus-Mobile.txt" "2" >> merged-vless.txt
          process_source "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/WHITE-CIDR-RU-all.txt" "3" >> merged-vless.txt
          process_source "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/WHITE-CIDR-RU-checked.txt" "4" >> merged-vless.txt
          process_source "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/WHITE-SNI-RU-all.txt" "5" >> merged-vless.txt
          process_source "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/BLACK_SS%2BAll_RUS.txt" "6" >> merged-vless.txt
          process_source "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/BLACK_VLESS_RUS.txt" "7" >> merged-vless.txt
          process_source "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/BLACK_VLESS_RUS_mobile.txt" "8" >> merged-vless.txt

          echo "Всего конфигов: $(wc -l < merged-vless.txt)"

      - name: Generate subscription file
        run: |
          # Заголовок для v2rayTun
          TITLE="HiBypass | LTE FREE 🏳🇷🇺"
          DESC="Бесплатный обход белых списков РФ 🏳🇷🇺 | ТГ : @Hibypass"
          UPLOAD="unlimited"
          DOWNLOAD="unlimited"
          TOTAL="unlimited"

          # Кодируем заголовок
          HEADER=$(printf "profile-title: base64:%s\nprofile-update-interval: 6\nsubscription-userinfo: upload=0; download=0; total=0; expire=0\nprofile-web-page-url: https://t.me/Hibypass\nsupport-url: https://t.me/Hibypass\nprofile-short-info: base64:%s" \
            "$(echo -n "$TITLE" | base64 -w 0)" \
            "$(echo -n "$DESC" | base64 -w 0)")

          # Кодируем конфиги в base64
          CONFIGS=$(base64 -w 0 merged-vless.txt)

          # Собираем финальный файл (заголовок + конфиги)
          echo "$HEADER" > vlees.txt
          echo "$CONFIGS" >> vlees.txt

          echo "Готово"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add merged-vless.txt vlees.txt
          git diff --staged --quiet || git commit -m "Auto: обновление VLESS конфигов $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
