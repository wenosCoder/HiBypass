name: Merge VLESS Configs

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get install -y netcat-openbsd curl openssl jq

      - name: Fetch and merge configs
        run: |
          printf '%s\n' \
            '#profile-title: HiBypass | LTE FREE 🏳🇷🇺' \
            '#profile-update-interval: 6' \
            '#support-url: https://t.me/Hibypass' \
            '#profile-web-page-url: https://t.me/Hibypass' \
            '#announce: Бесплатный обход белых списков РФ 🏳🇷🇺 | ТГ : @Hibypass' \
            '#traffic-limit: ∞' \
            '#traffic-remaining: ∞' \
            > vlees.txt

          SNI_DOMAINS="ads.x5.ru max.ru vk.ru yandex.com ya.ru"
          CONFIGS_TMP=$(mktemp)
          SEEN_HOSTS=$(mktemp)

          check_server() { nc -z -w 5 "$1" "$2" 2>/dev/null; }

          check_sni() {
            local HOST="$1" PORT="$2"
            for SNI in $SNI_DOMAINS; do
              echo "" | timeout 5 openssl s_client \
                -connect "${HOST}:${PORT}" -servername "$SNI" -alpn h2 2>/dev/null \
                | head -5 | grep -q "CONNECTED" && return 0
            done
            return 1
          }

          measure_ping() {
            local HOST="$1" PORT="$2" TOTAL=0 COUNT=0 START END
            for i in 1 2 3; do
              START=$(date +%s%3N)
              if nc -z -w 3 "$HOST" "$PORT" 2>/dev/null; then
                END=$(date +%s%3N)
                TOTAL=$((TOTAL + END - START)); COUNT=$((COUNT + 1))
              fi
            done
            [ "$COUNT" -eq 0 ] && echo "99999" || echo $((TOTAL / COUNT))
          }

          process_source() {
            local URL="$1" PREFIX="$2" TMPFILE HOST PORT HOSTPORT PING BASE
            TMPFILE=$(mktemp)
            curl -fsSL --max-time 30 --connect-timeout 10 "$URL" > "$TMPFILE" 2>/dev/null || { rm -f "$TMPFILE"; return; }
            grep -E '^vless://' "$TMPFILE" | sort -u | while IFS= read -r line; do
              BASE=$(echo "$line" | sed 's/#.*//')
              HOST=$(echo "$BASE" | sed 's/.*@//;s/[:/].*//')
              echo "$HOST" | grep -qE '^(84|89)\.' || continue
              PORT=$(echo "$BASE" | sed 's/.*@[^:]*://;s/[/?].*//')
              HOSTPORT="${HOST}:${PORT}"
              grep -qF "$HOSTPORT" "$SEEN_HOSTS" 2>/dev/null && continue
              check_server "$HOST" "$PORT" || continue
              check_sni "$HOST" "$PORT" || continue
              PING=$(measure_ping "$HOST" "$PORT")
              printf '%s\t%s\t%s\t%s\t%s\n' "$PING" "$BASE" "$HOST" "$PORT" "$PREFIX" >> "$CONFIGS_TMP"
              echo "$HOSTPORT" >> "$SEEN_HOSTS"
            done
            rm -f "$TMPFILE"
          }

          process_source "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/Vless-Reality-White-Lists-Rus-Mobile-2.txt" "1"
          process_source "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/Vless-Reality-White-Lists-Rus-Mobile.txt" "2"
          process_source "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/WHITE-CIDR-RU-all.txt" "3"
          process_source "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/WHITE-CIDR-RU-checked.txt" "4"
          process_source "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/WHITE-SNI-RU-all.txt" "5"
          process_source "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/BLACK_SS%2BAll_RUS.txt" "6"
          process_source "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/BLACK_VLESS_RUS.txt" "7"
          process_source "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/BLACK_VLESS_RUS_mobile.txt" "8"
          process_source "https://raw.githubusercontent.com/zieng2/wl/refs/heads/main/vless_universal.txt" "9"
          process_source "https://raw.githubusercontent.com/zieng2/wl/refs/heads/main/vless_lite.txt" "10"
          process_source "https://raw.githubusercontent.com/whoahaow/rjsxrd/refs/heads/main/githubmirror/bypass/bypass-all.txt" "11"
          process_source "https://raw.githubusercontent.com/whoahaow/rjsxrd/refs/heads/main/githubmirror/bypass-unsecure/bypass-unsecure-all.txt" "12"
          process_source "https://raw.githubusercontent.com/whoahaow/rjsxrd/refs/heads/main/githubmirror/split-by-protocols/vless-secure.txt" "13"
          process_source "https://raw.githubusercontent.com/whoahaow/rjsxrd/refs/heads/main/githubmirror/split-by-protocols/vless.txt" "14"

          SORTED_TMP=$(mktemp)
          sort -t$'\t' -k1 -n "$CONFIGS_TMP" > "$SORTED_TMP"
          TOTAL_LINES=$(wc -l < "$SORTED_TMP")
          TOTAL_PAKS=$(( (TOTAL_LINES + 9) / 10 ))
          GLOBAL_COUNTER=1

          # vlees.txt
          while IFS=$'\t' read -r PING BASE HOST PORT PREFIX; do
            PAK_NUM=$(( (GLOBAL_COUNTER - 1) / 10 + 1 ))
            LINE_IN_PAK=$(( (GLOBAL_COUNTER - 1) % 10 + 1 ))
            echo "${BASE}#🇪🇺LTE | ${PAK_NUM}.${LINE_IN_PAK}" >> vlees.txt
            GLOBAL_COUNTER=$((GLOBAL_COUNTER + 1))
          done < "$SORTED_TMP"

          # packs.json
          ALL_PACKS_JSON="[]"

          for PAK in $(seq 1 $TOTAL_PAKS); do
            START_LINE=$(( (PAK - 1) * 10 + 1 ))
            END_LINE=$(( PAK * 10 ))
            OUTBOUNDS_JSON="[]"
            IDX=1

            while IFS=$'\t' read -r PING BASE HOST PORT PREFIX; do
              UUID=$(echo "$BASE" | sed 's/vless:\/\///;s/@.*//')
              PARAMS=$(echo "$BASE" | grep -o '?.*' | tr '?&' '\n\n')
              get_param() { echo "$PARAMS" | grep "^$1=" | cut -d= -f2; }
              FLOW=$(get_param flow); SNI=$(get_param sni); PBK=$(get_param pbk)
              FP=$(get_param fp);   SID=$(get_param sid); NET=$(get_param type)
              SEC=$(get_param security)
              [ -z "$NET" ]  && NET="tcp"
              [ -z "$FP" ]   && FP="chrome"
              [ -z "$FLOW" ] && FLOW="xtls-rprx-vision"

              OB=$(jq -n \
                --arg tag "lte-${PAK}-${IDX}" --arg addr "$HOST" \
                --argjson port "$PORT"         --arg uuid "$UUID" \
                --arg flow "$FLOW"             --arg net "$NET" \
                --arg sec "$SEC"               --arg sni "$SNI" \
                --arg pbk "$PBK"               --arg fp "$FP" \
                --arg sid "$SID" \
                '{tag:$tag,protocol:"vless",
                  settings:{vnext:[{address:$addr,port:$port,
                    users:[{id:$uuid,encryption:"none",flow:$flow}]}]},
                  streamSettings:{network:$net,security:$sec,
                    realitySettings:{serverName:$sni,publicKey:$pbk,
                      shortId:$sid,fingerprint:$fp}}}')

              OUTBOUNDS_JSON=$(echo "$OUTBOUNDS_JSON" | jq --argjson ob "$OB" '. + [$ob]')
              IDX=$((IDX + 1))
            done < <(sed -n "${START_LINE},${END_LINE}p" "$SORTED_TMP")

            PAK_JSON=$(jq -n \
              --arg rem "🇪🇺LTE | Пак ${PAK}" \
              --argjson out "$OUTBOUNDS_JSON" \
              --argjson pak "$PAK" \
              '{
                remarks: $rem,
                dns: {servers:["1.1.1.1","1.0.0.1"], queryStrategy:"UseIP"},
                routing: {
                  domainMatcher:"hybrid", domainStrategy:"IPIfNonMatch",
                  rules:[
                    {type:"field",protocol:["bittorrent"],outboundTag:"direct"},
                    {type:"field",inboundTag:["socks","http"],
                     balancerTag:("LTE-PAK-"+($pak|tostring))}
                  ],
                  balancers:[{
                    tag:("LTE-PAK-"+($pak|tostring)),
                    selector:[("lte-"+($pak|tostring))],
                    strategy:{type:"leastPing",settings:{
                      maxRTT:"1400ms",expected:3,baselines:["1200ms"],tolerance:0.05}},
                    fallbackTag:"direct"
                  }]
                },
                inbounds:[
                  {tag:"socks",port:10808,listen:"127.0.0.1",protocol:"socks",
                   settings:{udp:true,auth:"noauth"},
                   sniffing:{enabled:true,routeOnly:false,destOverride:["http","tls","quic"]}},
                  {tag:"http",port:10809,listen:"127.0.0.1",protocol:"http",
                   settings:{allowTransparent:false},
                   sniffing:{enabled:true,routeOnly:false,destOverride:["http","tls","quic"]}}
                ],
                outbounds:($out + [
                  {tag:"direct",protocol:"freedom"},
                  {tag:"block",protocol:"blackhole"}
                ]),
                burstObservatory:{
                  pingConfig:{timeout:"2s",interval:"10s",sampling:2,
                    httpMethod:"GET",destination:"https://www.gstatic.com/generate_204",
                    connectivity:""},
                  subjectSelector:[("lte-"+($pak|tostring))]
                }
              }')

            ALL_PACKS_JSON=$(echo "$ALL_PACKS_JSON" | jq --argjson p "$PAK_JSON" '. + [$p]')
          done

          echo "$ALL_PACKS_JSON" | jq '.' > packs.json
          rm -f "$CONFIGS_TMP" "$SEEN_HOSTS" "$SORTED_TMP"

          echo "✅ Конфигов: $(grep -cE '^vless://' vlees.txt || echo 0), Паков: $TOTAL_PAKS"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add vlees.txt packs.json
          git diff --staged --quiet || git commit -m "Auto: обновление $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
