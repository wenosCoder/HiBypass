name: Merge VLESS Configs

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  merge:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch and merge VLESS configs
        run: |
          cat > vlees.txt << 'EOF'
          #profile-title: HiBypass | LTE FREE 🏳🇷🇺
          #profile-update-interval: 6
          #support-url: https://t.me/Hibypass
          #profile-web-page-url: https://t.me/Hibypass
          #announce: Бесплатный обход белых списков РФ 🏳🇷🇺 | ТГ : @Hibypass
          #traffic-limit: ∞
          #traffic-remaining: ∞
          EOF

          process_source() {
            local URL="$1"
            local PREFIX="$2"
            local COUNTER=1
            curl -fsSL "$URL" | grep -E '^(vless|vmess|trojan|ss|tuic|hysteria|hysteria2|hy2)://' | sort -u | while IFS= read -r line; do
              BASE=$(echo "$line" | sed 's/#.*//')
              # Извлекаем IP/хост — часть после @ до : или /
              HOST=$(echo "$BASE" | grep -oP '(?<=@)[^:/@]+')
              # Оставляем только IP начинающиеся на 84. или 89.
              if echo "$HOST" | grep -qE '^(84|89)\.'; then
                echo "${BASE}#🇪🇺LTE | ${PREFIX}.${COUNTER}"
                COUNTER=$((COUNTER + 1))
              fi
            done
          }

          # Оригинальные источники
          process_source "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/Vless-Reality-White-Lists-Rus-Mobile-2.txt" "1" >> vlees.txt
          process_source "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/Vless-Reality-White-Lists-Rus-Mobile.txt" "2" >> vlees.txt
          process_source "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/WHITE-CIDR-RU-all.txt" "3" >> vlees.txt
          process_source "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/WHITE-CIDR-RU-checked.txt" "4" >> vlees.txt
          process_source "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/WHITE-SNI-RU-all.txt" "5" >> vlees.txt
          process_source "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/BLACK_SS%2BAll_RUS.txt" "6" >> vlees.txt
          process_source "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/BLACK_VLESS_RUS.txt" "7" >> vlees.txt
          process_source "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/BLACK_VLESS_RUS_mobile.txt" "8" >> vlees.txt

          # Новые источники zieng2
          process_source "https://raw.githubusercontent.com/zieng2/wl/refs/heads/main/vless_universal.txt" "9" >> vlees.txt
          process_source "https://raw.githubusercontent.com/zieng2/wl/refs/heads/main/vless_lite.txt" "10" >> vlees.txt

          # Новые источники whoahaow
          process_source "https://raw.githubusercontent.com/whoahaow/rjsxrd/refs/heads/main/githubmirror/bypass/bypass-all.txt" "11" >> vlees.txt
          process_source "https://raw.githubusercontent.com/whoahaow/rjsxrd/refs/heads/main/githubmirror/bypass-unsecure/bypass-unsecure-all.txt" "12" >> vlees.txt
          process_source "https://raw.githubusercontent.com/whoahaow/rjsxrd/refs/heads/main/githubmirror/split-by-protocols/vless-secure.txt" "13" >> vlees.txt
          process_source "https://raw.githubusercontent.com/whoahaow/rjsxrd/refs/heads/main/githubmirror/split-by-protocols/vmess-secure.txt" "14" >> vlees.txt
          process_source "https://raw.githubusercontent.com/whoahaow/rjsxrd/refs/heads/main/githubmirror/split-by-protocols/trojan-secure.txt" "15" >> vlees.txt
          process_source "https://raw.githubusercontent.com/whoahaow/rjsxrd/refs/heads/main/githubmirror/split-by-protocols/ss-secure.txt" "16" >> vlees.txt
          process_source "https://raw.githubusercontent.com/whoahaow/rjsxrd/refs/heads/main/githubmirror/split-by-protocols/tuic-secure.txt" "17" >> vlees.txt
          process_source "https://raw.githubusercontent.com/whoahaow/rjsxrd/refs/heads/main/githubmirror/split-by-protocols/hysteria-secure.txt" "18" >> vlees.txt
          process_source "https://raw.githubusercontent.com/whoahaow/rjsxrd/refs/heads/main/githubmirror/split-by-protocols/hysteria2-secure.txt" "19" >> vlees.txt
          process_source "https://raw.githubusercontent.com/whoahaow/rjsxrd/refs/heads/main/githubmirror/split-by-protocols/hy2-secure.txt" "20" >> vlees.txt
          process_source "https://raw.githubusercontent.com/whoahaow/rjsxrd/refs/heads/main/githubmirror/split-by-protocols/vless.txt" "21" >> vlees.txt

          echo "Всего конфигов: $(wc -l < vlees.txt)"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add vlees.txt
          git diff --staged --quiet || git commit -m "Auto: обновление $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
