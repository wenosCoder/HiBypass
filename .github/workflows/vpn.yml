name: Merge VLESS Configs

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  merge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Build configs
        run: |
          python3 << 'PYEOF'
          import os, json, urllib.request

          GROUP_SIZE = 20
          OUTPUT_DIR = "configs"
          VLESS_TXT  = "vlees.txt"
          os.makedirs(OUTPUT_DIR, exist_ok=True)

          SOURCES = [
            "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/Vless-Reality-White-Lists-Rus-Mobile-2.txt",
            "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/Vless-Reality-White-Lists-Rus-Mobile.txt",
            "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/WHITE-CIDR-RU-all.txt",
            "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/WHITE-CIDR-RU-checked.txt",
            "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/WHITE-SNI-RU-all.txt",
            "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/BLACK_SS%2BAll_RUS.txt",
            "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/BLACK_VLESS_RUS.txt",
            "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/BLACK_VLESS_RUS_mobile.txt",
          ]

          def parse_vless(uri):
            try:
              body     = uri[len("vless://"):]
              uuid     = body.split("@")[0]
              rest     = body.split("@", 1)[1]
              hostport = rest.split("?")[0]
              host     = hostport.rsplit(":", 1)[0]
              port     = hostport.rsplit(":", 1)[1]
              params_raw = rest.split("?", 1)[1].split("#")[0] if "?" in rest else ""
              params   = dict(p.split("=", 1) for p in params_raw.split("&") if "=" in p)
              pbk = params.get("pbk", "")
              if not pbk:
                return None
              return {
                "uuid": uuid,
                "host": host,
                "port": int(port),
                "flow": params.get("flow", "xtls-rprx-vision"),
                "sni":  params.get("sni", host),
                "pbk":  pbk,
                "fp":   params.get("fp", "chrome"),
                "sid":  params.get("sid", ""),
                "net":  params.get("type", "tcp"),
                "uri":  uri,
              }
            except Exception:
              return None

          def make_outbound(tag, p):
            return {
              "tag": tag, "protocol": "vless",
              "settings": {"vnext": [{"address": p["host"], "port": p["port"],
                "users": [{"id": p["uuid"], "encryption": "none", "flow": p["flow"]}]}]},
              "streamSettings": {"network": p["net"], "tcpSettings": {}, "security": "reality",
                "realitySettings": {"serverName": p["sni"], "publicKey": p["pbk"],
                  "shortId": p["sid"], "fingerprint": p["fp"]}}
            }

          def make_config(label, outbounds, tags):
            return {
              "remarks": label,
              "dns": {"servers": ["1.1.1.1", "1.0.0.1"], "queryStrategy": "UseIP"},
              "routing": {
                "domainMatcher": "hybrid", "domainStrategy": "IPIfNonMatch",
                "rules": [
                  {"type": "field", "protocol": ["bittorrent"], "outboundTag": "direct"},
                  {"type": "field", "inboundTag": ["socks", "http"], "balancerTag": "AUTO-BAL"}
                ],
                "balancers": [{"tag": "AUTO-BAL", "selector": tags,
                  "strategy": {"type": "leastPing",
                    "settings": {"maxRTT": "2000ms", "expected": 3,
                                 "baselines": ["1200ms"], "tolerance": 0.1}},
                  "fallbackTag": "direct"}]
              },
              "inbounds": [
                {"tag": "socks", "port": 10808, "listen": "127.0.0.1", "protocol": "socks",
                 "settings": {"udp": True, "auth": "noauth"},
                 "sniffing": {"enabled": True, "routeOnly": False,
                              "destOverride": ["http", "tls", "quic"]}},
                {"tag": "http", "port": 10809, "listen": "127.0.0.1", "protocol": "http",
                 "settings": {"allowTransparent": False},
                 "sniffing": {"enabled": True, "routeOnly": False,
                              "destOverride": ["http", "tls", "quic"]}}
              ],
              "outbounds": outbounds + [
                {"tag": "direct", "protocol": "freedom"},
                {"tag": "block",  "protocol": "blackhole"}
              ],
              "burstObservatory": {
                "pingConfig": {"timeout": "2s", "interval": "10s", "sampling": 2,
                  "httpMethod": "GET",
                  "destination": "https://www.gstatic.com/generate_204",
                  "connectivity": ""},
                "subjectSelector": tags
              }
            }

          # ── 1. Собираем ВСЕ уникальные vless из всех источников ──
          print("=== Fetching all sources ===")
          all_parsed = {}   # host:port -> parsed dict (дедупликация)

          for idx, url in enumerate(SOURCES, 1):
            print(f"  [{idx}/{len(SOURCES)}] {url}")
            try:
              with urllib.request.urlopen(url, timeout=30) as r:
                lines = r.read().decode("utf-8", errors="ignore").splitlines()
            except Exception as e:
              print(f"    ERROR: {e}")
              continue

            for line in lines:
              line = line.strip()
              if not line.startswith("vless://"):
                continue
              p = parse_vless(line)
              if not p:
                continue
              key = f"{p['host']}:{p['port']}"
              if key not in all_parsed:
                all_parsed[key] = p

          all_nodes = list(all_parsed.values())
          print(f"\nTotal unique nodes: {len(all_nodes)}")

          if not all_nodes:
            print("No nodes found, exiting")
            exit(0)

          # ── 2. Нарезаем на группы по GROUP_SIZE ──
          chunks = [all_nodes[i:i+GROUP_SIZE] for i in range(0, len(all_nodes), GROUP_SIZE)]
          print(f"Groups of {GROUP_SIZE}: {len(chunks)}")

          # ── 3. vlees.txt header ──
          with open(VLESS_TXT, "w") as f:
            f.write("#profile-title: HiBypass | LTE FREE\n")
            f.write("#profile-update-interval: 6\n")
            f.write("#support-url: https://t.me/Hibypass\n")
            f.write("#traffic-limit: inf\n")
            f.write("#traffic-remaining: inf\n")

          generated = []

          # ── 4. Генерируем lte_1.json, lte_2.json ... ──
          for group_idx, chunk in enumerate(chunks, 1):
            label     = f"LTE | Auto {group_idx}"
            outbounds = []
            tags      = []

            for node_idx, p in enumerate(chunk, 1):
              tag = f"g{group_idx}-{node_idx}"
              outbounds.append(make_outbound(tag, p))
              tags.append(tag)

            cfg   = make_config(label, outbounds, tags)
            fname = f"lte_{group_idx}.json"
            fpath = os.path.join(OUTPUT_DIR, fname)

            with open(fpath, "w") as f:
              json.dump(cfg, f, ensure_ascii=False, indent=2)

            generated.append(fname)

            # append to vlees.txt
            with open(VLESS_TXT, "a") as f:
              for p in chunk:
                base = p["uri"].split("#")[0]
                f.write(f"{base}#{label}\n")

            print(f"  OK {fpath} ({len(tags)} nodes)")

          # ── 5. subscription.txt — список raw-ссылок ──
          repo = os.environ.get("GITHUB_REPOSITORY", "USER/REPO")
          raw_base = f"https://raw.githubusercontent.com/{repo}/main/configs"

          with open(os.path.join(OUTPUT_DIR, "subscription.txt"), "w") as f:
            f.write("#profile-title: HiBypass | LTE ALL\n")
            f.write("#profile-update-interval: 6\n")
            f.write("#support-url: https://t.me/Hibypass\n")
            for fname in generated:
              f.write(f"{raw_base}/{fname}\n")

          print(f"\n=== Done ===")
          print(f"  JSON files   : {len(generated)}")
          print(f"  subscription : configs/subscription.txt")
          PYEOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add configs/ vlees.txt
          git diff --staged --quiet || git commit -m "Auto: update $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
