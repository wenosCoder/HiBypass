merge:
    needs: fetch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get install -y jq

      - name: Download all batches
        uses: actions/download-artifact@v4
        with:
          pattern: batch-*
          merge-multiple: true

      - name: Merge and generate files
        run: |
          printf '%s\n' \
            '#profile-title: HiBypass | LTE FREE 🏳🇷🇺' \
            '#profile-update-interval: 1' \
            '#support-url: https://t.me/Hibypass' \
            '#profile-web-page-url: https://t.me/Hibypass' \
            '#announce: Бесплатный обход белых списков РФ 🏳🇷🇺 | ТГ : @Hibypass' \
            '#traffic-limit: ∞' \
            '#traffic-remaining: ∞' \
            > vlees.txt

          MERGED_TMP=$(mktemp)
          cat batch_*.tmp 2>/dev/null > "$MERGED_TMP"
          echo "Всего строк до дедупликации: $(wc -l < "$MERGED_TMP")"

          DEDUP_TMP=$(mktemp)
          awk -F'\t' '!seen[$2":"$3]++' "$MERGED_TMP" > "$DEDUP_TMP"

          TOTAL=$(wc -l < "$DEDUP_TMP")
          echo "Всего уникальных конфигов: $TOTAL"

          # Генерируем vlees.txt
          IDX=1
          while IFS=$'\t' read -r BASE HOST PORT PREFIX; do
            printf '%s\n' "${BASE}#🇪🇺LTE | ${IDX} 🌐 RU" >> vlees.txt
            IDX=$((IDX + 1))
          done < "$DEDUP_TMP"

          # Генерируем все outbounds через Python (быстро, без jq в цикле)
          ALL_OUTBOUNDS=$(mktemp)

          python3 - "$DEDUP_TMP" "$ALL_OUTBOUNDS" << 'PYEOF'
          import sys, json, re

          infile  = sys.argv[1]
          outfile = sys.argv[2]

          results = []
          idx = 1

          with open(infile, encoding='utf-8', errors='replace') as f:
            for line in f:
              parts = line.rstrip('\n').split('\t')
              if len(parts) < 3:
                idx += 1
                continue
              base, host, port = parts[0], parts[1], parts[2]
              if not port.isdigit():
                idx += 1
                continue

              # UUID
              m = re.match(r'vless://([^@]+)@', base)
              uuid = m.group(1) if m else ''

              # Query params
              m2 = re.search(r'\?([^#]*)', base)
              query = m2.group(1) if m2 else ''
              def get_param(key):
                m = re.search(rf'(?:^|&){key}=([^&]*)', query)
                return m.group(1) if m else ''

              flow = get_param('flow') or 'xtls-rprx-vision'
              sni  = get_param('sni')
              pbk  = get_param('pbk')
              fp   = get_param('fp') or 'chrome'
              sid  = get_param('sid')
              sec  = get_param('security') or 'reality'

              obj = {
                "tag": f"lte-{idx}",
                "protocol": "vless",
                "settings": {
                  "vnext": [{
                    "address": host,
                    "port": int(port),
                    "users": [{"id": uuid, "encryption": "none", "flow": flow}]
                  }]
                },
                "streamSettings": {
                  "network": "tcp",
                  "security": sec,
                  "realitySettings": {
                    "serverName": sni,
                    "publicKey": pbk,
                    "shortId": sid,
                    "fingerprint": fp
                  }
                }
              }
              results.append(json.dumps(obj, ensure_ascii=False))
              idx += 1

          with open(outfile, 'w', encoding='utf-8') as f:
            f.write('\n'.join(results))

          print(f"Python: сгенерировано {len(results)} outbounds")
          PYEOF

          CONF_COUNT=$(wc -l < "$ALL_OUTBOUNDS")
          echo "Сгенерировано outbounds: $CONF_COUNT"

          # Собираем паки по 20 через Python (быстро)
          python3 - "$ALL_OUTBOUNDS" packs.json << 'PYEOF'
          import sys, json

          infile  = sys.argv[1]
          outfile = sys.argv[2]

          PACK_SIZE = 20

          HEADER = {
            "dns": {
              "queryStrategy": "UseIPv4",
              "servers": [
                "1.1.1.1",
                "8.8.8.8",
                "tls://1.1.1.1",
                "https://dns.google/dns-query",
                "https://cloudflare-dns.com/dns-query"
              ]
            },
            "observatory": {
              "enableConcurrency": True,
              "probeInterval": "5s",
              "probeUrl": "http://www.gstatic.com/generate_204",
              "subjectSelector": ["lte-"]
            },
            "routing": {
              "domainMatcher": "hybrid",
              "domainStrategy": "IPIfNonMatch",
              "rules": [
                {"type": "field", "protocol": ["bittorrent"], "outboundTag": "direct"},
                {"type": "field", "inboundTag": ["socks", "http"], "balancerTag": "BALANCER"}
              ],
              "balancers": [{
                "tag": "BALANCER",
                "selector": ["lte-"],
                "fallbackTag": "backup",
                "strategy": {
                  "type": "leastLoad",
                  "settings": {
                    "expected": 1,
                    "maxRTT": "4s",
                    "baselines": ["3s"]
                  }
                }
              }]
            },
            "inbounds": [
              {
                "tag": "socks", "port": 10808, "listen": "127.0.0.1",
                "protocol": "socks",
                "settings": {"udp": True, "auth": "noauth"},
                "sniffing": {"enabled": True, "routeOnly": False, "destOverride": ["http","tls","quic"]}
              },
              {
                "tag": "http", "port": 10809, "listen": "127.0.0.1",
                "protocol": "http",
                "settings": {"allowTransparent": False},
                "sniffing": {"enabled": True, "routeOnly": False, "destOverride": ["http","tls","quic"]}
              }
            ]
          }

          SYSTEM_OUTBOUNDS = [
            {"tag": "direct",  "protocol": "freedom"},
            {"tag": "backup",  "protocol": "freedom"},
            {"tag": "block",   "protocol": "blackhole"}
          ]

          with open(infile, encoding='utf-8') as f:
            lines = [l.strip() for l in f if l.strip()]

          packs = []
          pack_num = 1

          for i in range(0, len(lines), PACK_SIZE):
            chunk = lines[i:i+PACK_SIZE]
            outbounds = []
            for local_idx, raw in enumerate(chunk, 1):
              try:
                obj = json.loads(raw)
                obj["tag"] = f"lte-{local_idx}"
                outbounds.append(obj)
              except Exception:
                continue

            pack = {"remarks": f"🇪🇺LTE | 1.{pack_num} 🌐"}
            pack.update(HEADER)
            pack["outbounds"] = outbounds + SYSTEM_OUTBOUNDS
            packs.append(pack)
            print(f"✅ Пак 1.{pack_num} ({len(outbounds)} серверов)")
            pack_num += 1

          # Записываем с заголовками
          header_lines = [
            "// profile-title: HiBypass 🗽 | FREE LTE | ∞",
            "// subscription-userinfo: upload=0; download=0; total=999999999999999; expire=4102444800",
            "// profile-update-interval: 1",
            "// announce: Бесплатный обход белых списков 🏳🇷🇺 | Если перестало работать — обновите подписку 🔄",
            "// announce-url: https://t.me/HiBypass",
            "// update-always: true",
          ]

          with open(outfile, 'w', encoding='utf-8') as f:
            f.write('\n'.join(header_lines) + '\n')
            json.dump(packs, f, ensure_ascii=False, indent=2)

          print(f"✅ Готово: {len(lines)} серверов в {pack_num-1} паках")
          PYEOF

          rm -f "$MERGED_TMP" "$DEDUP_TMP" "$ALL_OUTBOUNDS"

      - name: Validate JSON
        run: |
          if grep -v '^//' packs.json | jq empty 2>/dev/null; then
            PACK_COUNT=$(grep -v '^//' packs.json | jq 'length')
            SERVER_COUNT=$(grep -v '^//' packs.json | jq '[.[].outbounds[]|select(.tag|startswith("lte-"))]|length')
            echo "✅ packs.json валидный | $PACK_COUNT паков | $SERVER_COUNT серверов"
          else
            echo "❌ packs.json невалидный!"
            exit 1
          fi

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add vlees.txt packs.json
          SERVER_COUNT=$(grep -v '^//' packs.json | jq '[.[].outbounds[]|select(.tag|startswith("lte-"))]|length')
          PACK_COUNT=$(grep -v '^//' packs.json | jq 'length')
          git diff --staged --quiet || git commit -m "Auto: $(date -u '+%Y-%m-%d %H:%M UTC') | $SERVER_COUNT серверов | $PACK_COUNT паков"
          git push
