- name: Convert VLESS to JSON and split by 20
        run: |
          set -euo pipefail

          echo "🚀 Начало обработки VLESS конфигов..."

          # ==================== УЛУЧШЕННЫЙ ПАРСЕР ====================
          parse_vless() {
            local url="$1"
            local remark="$2"

            # Базовое извлечение
            local temp="${url#vless://}"
            local uuid="${temp%%@*}"
            local rest="${temp#*@}"
            local address="${rest%%:*}"
            local port="\( {rest#*:}"; port=" \){port%%[?#]*}"

            local query=""
            [[ "\( rest" == *"?"* ]] && query=" \){rest#*\?}" && query="${query%%#*}"

            # Параметры
            local pbk=$(echo "$query" | grep -o 'pbk=[^&]*' | cut -d'=' -f2 || echo "")
            local sni=$(echo "$query" | grep -o 'sni=[^&]*' | cut -d'=' -f2 || echo "$address")
            local fp=$(echo "$query" | grep -o 'fp=[^&]*' | cut -d'=' -f2 || echo "chrome")
            local flow=$(echo "$query" | grep -o 'flow=[^&]*' | cut -d'=' -f2 || echo "")
            local security=$(echo "$query" | grep -o 'security=[^&]*' | cut -d'=' -f2 || echo "reality")

            if [[ -z "$pbk" ]]; then
              echo "⚠️ Пропуск (нет pbk): ${remark:0:60}..." >&2
              return 1
            fi

            jq -n \
              --arg tag "proxy" \
              --arg protocol "vless" \
              --arg address "$address" \
              --arg port "$port" \
              --arg id "$uuid" \
              --arg flow "$flow" \
              --arg security "$security" \
              --arg sni "$sni" \
              --arg fp "$fp" \
              --arg pbk "$pbk" \
              '{
                tag: $tag,
                protocol: $protocol,
                settings: {
                  vnext: [{
                    address: $address,
                    port: ($port | tonumber),
                    users: [{ id: $id, encryption: "none", flow: $flow }]
                  }]
                },
                streamSettings: {
                  network: "tcp",
                  security: $security,
                  realitySettings: {
                    serverName: $sni,
                    publicKey: $pbk,
                    fingerprint: $fp,
                    shortId: ""
                  }
                }
              }'
          }

          # ==================== БАЗОВЫЙ ШАБЛОН ====================
          cat > base_config.json << 'EOL'
          {
            "dns": {
              "servers": ["1.1.1.1", "1.0.0.1"],
              "queryStrategy": "UseIP"
            },
            "routing": {
              "rules": [{"type": "field", "protocol": ["bittorrent"], "outboundTag": "direct"}],
              "domainMatcher": "hybrid",
              "domainStrategy": "IPIfNonMatch"
            },
            "inbounds": [
              {
                "tag": "socks",
                "port": 10808,
                "listen": "127.0.0.1",
                "protocol": "socks",
                "settings": {"udp": true, "auth": "noauth"},
                "sniffing": {"enabled": true, "destOverride": ["http", "tls", "quic"]}
              },
              {
                "tag": "http",
                "port": 10809,
                "listen": "127.0.0.1",
                "protocol": "http",
                "settings": {"allowTransparent": false},
                "sniffing": {"enabled": true, "destOverride": ["http", "tls", "quic"]}
              }
            ],
            "outbounds": [],
            "remarks": "🇪🇺 LTE | Base"
          }
          EOL

          # ==================== ОБРАБОТКА ====================
          process_source() {
            local url="$1"
            local block="$2"

            echo "📥 Загрузка источника $block..."
            mapfile -t links < <(curl -fsSL "$url" 2>/dev/null | grep -E '^vless://' | sort -u)

            echo "   Найдено: ${#links[@]} ссылок"

            if [[ ${#links[@]} -eq 0 ]]; then
              echo "   ⚠️ Пустой источник"
              return 0
            fi

            local batch=1
            local i=0
            while (( i < ${#links[@]} )); do
              local chunk=("${links[@]:i:20}")
              process_batch "$block" "\( batch" " \){chunk[@]}"
              batch=$((batch + 1))
              i=$((i + 20))
            done
          }

          process_batch() {
            local block=$1 batch=$2
            shift 2
            local configs=("$@")
            local outfile="lte_\( {block}_ \){batch}.json"

            cp base_config.json "$outfile"

            local added=0
            for idx in "${!configs[@]}"; do
              local rem="🇪🇺 LTE | \( {block}. \){batch} | node$((idx+1))"
              if parse_vless "${configs[$idx]}" "$rem" >> "$outfile.tmp" 2>> parse.log; then
                ((added++))
              fi
            done

            if [[ $added -gt 0 ]]; then
              jq -s '.[0] as $b | $b + {outbounds: (.[1:])}' "$outfile" "$outfile.tmp" > "$outfile.new" 2>> parse.log && \
              mv "$outfile.new" "$outfile"
              
              jq --arg r "🇪🇺 LTE | \( {block}. \){batch} (${added} nodes)" '.remarks = $r' "$outfile" > "$outfile.new" && \
              mv "$outfile.new" "$outfile"
              
              echo "✅ Создан: \( outfile ( \){added} нод)"
            else
              rm -f "$outfile"*
              echo "❌ Блок \( {block}. \){batch} — ничего не добавлено"
            fi
          }

          rm -f lte_*.json parse.log

          process_source "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/Vless-Reality-White-Lists-Rus-Mobile-2.txt" "1"
          process_source "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/Vless-Reality-White-Lists-Rus-Mobile.txt" "2"
          process_source "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/WHITE-CIDR-RU-all.txt" "3"
          process_source "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/WHITE-CIDR-RU-checked.txt" "4"
          process_source "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/WHITE-SNI-RU-all.txt" "5"
          process_source "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/BLACK_SS%2BAll_RUS.txt" "6"
          process_source "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/BLACK_VLESS_RUS.txt" "7"
          process_source "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/BLACK_VLESS_RUS_mobile.txt" "8"

          echo "=== ИТОГ ==="
          ls lte_*.json 2>/dev/null | wc -l | xargs echo "Создано JSON файлов:"
          ls -lh lte_*.json 2>/dev/null || echo "Файлы НЕ созданы!"
