merge:
    needs: fetch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get install -y jq

      - name: Download all batches
        uses: actions/download-artifact@v4
        with:
          pattern: batch-*
          merge-multiple: true

      - name: Merge and generate files
        run: |
          printf '%s\n' \
            '#profile-title: HiBypass | LTE FREE 🏳🇷🇺' \
            '#profile-update-interval: 1' \
            '#support-url: https://t.me/Hibypass' \
            '#profile-web-page-url: https://t.me/Hibypass' \
            '#announce: Бесплатный обход белых списков РФ 🏳🇷🇺 | ТГ : @Hibypass' \
            '#traffic-limit: ∞' \
            '#traffic-remaining: ∞' \
            > vlees.txt

          MERGED_TMP=$(mktemp)
          cat batch_*.tmp 2>/dev/null > "$MERGED_TMP"
          echo "Всего строк до дедупликации: $(wc -l < "$MERGED_TMP")"

          DEDUP_TMP=$(mktemp)
          awk -F'\t' '!seen[$2":"$3]++' "$MERGED_TMP" > "$DEDUP_TMP"

          TOTAL=$(wc -l < "$DEDUP_TMP")
          echo "Всего уникальных конфигов: $TOTAL"

          if [ "$TOTAL" -gt 5000 ]; then
            head -n 5000 "$DEDUP_TMP" > "${DEDUP_TMP}.trimmed"
            mv "${DEDUP_TMP}.trimmed" "$DEDUP_TMP"
            echo "Обрезано до 5000 конфигов"
          fi

          IDX=1
          while IFS=$'\t' read -r BASE HOST PORT PREFIX; do
            printf '%s\n' "${BASE}#🇪🇺LTE | ${IDX} 🌐 RU" >> vlees.txt
            IDX=$((IDX + 1))
          done < "$DEDUP_TMP"

          ALL_OUTBOUNDS=$(mktemp)
          IDX=1

          while IFS=$'\t' read -r BASE HOST PORT PREFIX; do
            printf '%s' "$PORT" | grep -qE '^[0-9]+$' || { IDX=$((IDX + 1)); continue; }

            UUID=$(printf '%s' "$BASE" | sed 's/vless:\/\///;s/@.*//')
            QUERY_RAW=$(printf '%s' "$BASE" | grep -o '?[^#]*')

            get_param() {
              printf '%s' "$QUERY_RAW" | grep -o "${1}=[^&]*" | head -1 | cut -d= -f2-
            }

            FLOW=$(get_param flow); SNI=$(get_param sni); PBK=$(get_param pbk)
            FP=$(get_param fp);     SID=$(get_param sid); SEC=$(get_param security)

            [ -z "$FP" ]   && FP="chrome"
            [ -z "$SEC" ]  && SEC="reality"
            [ -z "$FLOW" ] && FLOW="xtls-rprx-vision"
            [ -z "$SID" ]  && SID=""

            jq -cn \
              --arg  tag   "lte-${IDX}" \
              --arg  addr  "$HOST"       \
              --argjson port "$PORT"     \
              --arg  uuid  "$UUID"       \
              --arg  flow  "$FLOW"       \
              --arg  sec   "$SEC"        \
              --arg  sni   "$SNI"        \
              --arg  pbk   "$PBK"        \
              --arg  fp    "$FP"         \
              --arg  sid   "$SID"        \
              '{
                tag: $tag, protocol: "vless",
                settings: {vnext: [{address: $addr, port: $port,
                  users: [{id: $uuid, encryption: "none", flow: $flow}]}]},
                streamSettings: {network: "tcp", security: $sec,
                  realitySettings: {serverName: $sni, publicKey: $pbk,
                    shortId: $sid, fingerprint: $fp}}
              }' >> "$ALL_OUTBOUNDS"

            IDX=$((IDX + 1))
          done < "$DEDUP_TMP"

          CONF_COUNT=$((IDX - 1))
          echo "Сгенерировано outbounds: $CONF_COUNT"

          # ── Функция записывает пак прямо в файл, без subshell через $() ──
          # ARG1=remarks ARG2=selector ARG3=chunk_file ARG4=output_file
          write_pack() {
            local REMARKS="$1"
            local SELECTOR="$2"
            local CHUNK="$3"
            local OUTFILE="$4"
            local RETAGGED
            RETAGGED=$(mktemp)
            local i=1
            while IFS= read -r obj; do
              printf '%s\n' "$obj" | jq --arg t "${SELECTOR}-${i}" '.tag = $t'
              i=$((i + 1))
            done < "$CHUNK" > "$RETAGGED"

            jq -n \
              --arg r "$REMARKS" \
              --arg sel "$SELECTOR" \
              --slurpfile out "$RETAGGED" \
              '{
                remarks: $r,
                dns: {servers: ["1.1.1.1","1.0.0.1","8.8.8.8"], queryStrategy: "UseIPv4"},
                observatory: {
                  enableConcurrency: true,
                  probeInterval: "15s",
                  probeUrl: "http://www.gstatic.com/generate_204",
                  subjectSelector: [$sel]
                },
                routing: {
                  domainMatcher: "hybrid",
                  domainStrategy: "IPIfNonMatch",
                  rules: [
                    {type: "field", protocol: ["bittorrent"], outboundTag: "direct"},
                    {type: "field", inboundTag: ["socks","http"], balancerTag: "BALANCER"}
                  ],
                  balancers: [{
                    tag: "BALANCER",
                    selector: [$sel],
                    strategy: {type: "leastPing"}
                  }]
                },
                inbounds: [
                  {
                    tag: "socks", port: 10808, listen: "127.0.0.1", protocol: "socks",
                    settings: {udp: true, auth: "noauth"},
                    sniffing: {enabled: true, routeOnly: false, destOverride: ["http","tls","quic"]}
                  },
                  {
                    tag: "http", port: 10809, listen: "127.0.0.1", protocol: "http",
                    settings: {allowTransparent: false},
                    sniffing: {enabled: true, routeOnly: false, destOverride: ["http","tls","quic"]}
                  }
                ],
                outbounds: ($out + [{tag:"direct",protocol:"freedom"},{tag:"block",protocol:"blackhole"}])
              }' > "$OUTFILE"
            rm -f "$RETAGGED"
          }

          # ── LTE packs: по 50 серверов → packs.json ────────────────────────
          LTE_PACK_SIZE=50
          LTE_PACK_NUM=1
          LTE_PACKS_ARRAY=$(mktemp)
          echo "[]" > "$LTE_PACKS_ARRAY"
          LTE_CHUNK=$(mktemp)
          LTE_LINE_COUNT=0

          while IFS= read -r line; do
            printf '%s\n' "$line" >> "$LTE_CHUNK"
            LTE_LINE_COUNT=$((LTE_LINE_COUNT + 1))
            if [ "$LTE_LINE_COUNT" -eq "$LTE_PACK_SIZE" ]; then
              PACK_TMP=$(mktemp)
              write_pack "🇪🇺LTE | 1.${LTE_PACK_NUM} 🌐" "lte" "$LTE_CHUNK" "$PACK_TMP"
              TMP_ARRAY=$(mktemp)
              jq --slurpfile p "$PACK_TMP" '. + $p' "$LTE_PACKS_ARRAY" > "$TMP_ARRAY"
              mv "$TMP_ARRAY" "$LTE_PACKS_ARRAY"
              rm -f "$PACK_TMP"
              echo "✅ LTE пак 1.${LTE_PACK_NUM} (50 серверов)"
              LTE_PACK_NUM=$((LTE_PACK_NUM + 1))
              rm -f "$LTE_CHUNK"; LTE_CHUNK=$(mktemp); LTE_LINE_COUNT=0
            fi
          done < "$ALL_OUTBOUNDS"

          if [ "$LTE_LINE_COUNT" -gt 0 ]; then
            PACK_TMP=$(mktemp)
            write_pack "🇪🇺LTE | 1.${LTE_PACK_NUM} 🌐" "lte" "$LTE_CHUNK" "$PACK_TMP"
            TMP_ARRAY=$(mktemp)
            jq --slurpfile p "$PACK_TMP" '. + $p' "$LTE_PACKS_ARRAY" > "$TMP_ARRAY"
            mv "$TMP_ARRAY" "$LTE_PACKS_ARRAY"
            rm -f "$PACK_TMP"
            echo "✅ LTE пак 1.${LTE_PACK_NUM} ($LTE_LINE_COUNT серверов)"
          fi

          mv "$LTE_PACKS_ARRAY" packs.json
          rm -f "$LTE_CHUNK"

          # ── HARD packs: по 250 серверов → phard.json ─────────────────────
          HARD_PACK_SIZE=250
          HARD_PACK_NUM=1
          HARD_PACKS_ARRAY=$(mktemp)
          echo "[]" > "$HARD_PACKS_ARRAY"
          HARD_CHUNK=$(mktemp)
          HARD_LINE_COUNT=0

          while IFS= read -r line; do
            printf '%s\n' "$line" >> "$HARD_CHUNK"
            HARD_LINE_COUNT=$((HARD_LINE_COUNT + 1))
            if [ "$HARD_LINE_COUNT" -eq "$HARD_PACK_SIZE" ]; then
              PACK_TMP=$(mktemp)
              write_pack "🇺🇸💫 LTE | HARD 1.${HARD_PACK_NUM}" "hard" "$HARD_CHUNK" "$PACK_TMP"
              TMP_ARRAY=$(mktemp)
              jq --slurpfile p "$PACK_TMP" '. + $p' "$HARD_PACKS_ARRAY" > "$TMP_ARRAY"
              mv "$TMP_ARRAY" "$HARD_PACKS_ARRAY"
              rm -f "$PACK_TMP"
              echo "✅ HARD пак 1.${HARD_PACK_NUM} (250 серверов)"
              HARD_PACK_NUM=$((HARD_PACK_NUM + 1))
              rm -f "$HARD_CHUNK"; HARD_CHUNK=$(mktemp); HARD_LINE_COUNT=0
            fi
          done < "$ALL_OUTBOUNDS"

          if [ "$HARD_LINE_COUNT" -gt 0 ]; then
            PACK_TMP=$(mktemp)
            write_pack "🇺🇸💫 LTE | HARD 1.${HARD_PACK_NUM}" "hard" "$HARD_CHUNK" "$PACK_TMP"
            TMP_ARRAY=$(mktemp)
            jq --slurpfile p "$PACK_TMP" '. + $p' "$HARD_PACKS_ARRAY" > "$TMP_ARRAY"
            mv "$TMP_ARRAY" "$HARD_PACKS_ARRAY"
            rm -f "$PACK_TMP"
            echo "✅ HARD пак 1.${HARD_PACK_NUM} ($HARD_LINE_COUNT серверов)"
          fi

          mv "$HARD_PACKS_ARRAY" phard.json
          rm -f "$HARD_CHUNK" "$MERGED_TMP" "$DEDUP_TMP" "$ALL_OUTBOUNDS"
          echo "✅ Готово: $CONF_COUNT серверов | LTE паков: $LTE_PACK_NUM | HARD паков: $HARD_PACK_NUM"

      - name: Validate JSON
        run: |
          if jq empty packs.json 2>/dev/null; then
            PACK_COUNT=$(jq 'length' packs.json)
            SERVER_COUNT=$(jq '[.[].outbounds[]|select(.tag|startswith("lte-"))]|length' packs.json)
            echo "✅ packs.json валидный | $PACK_COUNT паков | $SERVER_COUNT серверов"
          else
            echo "❌ packs.json невалидный!"
            exit 1
          fi

          if jq empty phard.json 2>/dev/null; then
            HARD_PACK_COUNT=$(jq 'length' phard.json)
            HARD_SERVER_COUNT=$(jq '[.[].outbounds[]|select(.tag|startswith("hard-"))]|length' phard.json)
            echo "✅ phard.json валидный | $HARD_PACK_COUNT паков | $HARD_SERVER_COUNT серверов"
          else
            echo "❌ phard.json невалидный!"
            exit 1
          fi

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add vlees.txt packs.json phard.json
          SERVER_COUNT=$(jq '[.[].outbounds[]|select(.tag|startswith("lte-"))]|length' packs.json)
          PACK_COUNT=$(jq 'length' packs.json)
          HARD_SERVER_COUNT=$(jq '[.[].outbounds[]|select(.tag|startswith("hard-"))]|length' phard.json)
          HARD_PACK_COUNT=$(jq 'length' phard.json)
          git diff --staged --quiet || git commit -m "Auto: $(date -u '+%Y-%m-%d %H:%M UTC') | LTE: $SERVER_COUNT серверов $PACK_COUNT паков | HARD: $HARD_SERVER_COUNT серверов $HARD_PACK_COUNT паков"
          git push
