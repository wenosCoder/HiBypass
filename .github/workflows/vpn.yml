name: Merge VLESS Configs

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  merge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get install -y jq curl

      - name: Build configs
        run: |
          python3 << 'PYEOF'
          import os, subprocess, json, re, urllib.request, tempfile

          GROUP_SIZE = 20
          OUTPUT_DIR = "configs"
          VLESS_TXT  = "vlees.txt"
          os.makedirs(OUTPUT_DIR, exist_ok=True)

          SOURCES = [
            "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/Vless-Reality-White-Lists-Rus-Mobile-2.txt",
            "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/Vless-Reality-White-Lists-Rus-Mobile.txt",
            "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/WHITE-CIDR-RU-all.txt",
            "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/WHITE-CIDR-RU-checked.txt",
            "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/WHITE-SNI-RU-all.txt",
            "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/BLACK_SS%2BAll_RUS.txt",
            "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/BLACK_VLESS_RUS.txt",
            "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/BLACK_VLESS_RUS_mobile.txt",
          ]

          def parse_vless(uri):
            try:
              body  = uri[len("vless://"):]
              uuid  = body.split("@")[0]
              rest  = body.split("@", 1)[1]
              hostport = rest.split("?")[0]
              host  = hostport.rsplit(":", 1)[0]
              port  = hostport.rsplit(":", 1)[1]
              params_raw = rest.split("?", 1)[1].split("#")[0] if "?" in rest else ""
              params = dict(p.split("=", 1) for p in params_raw.split("&") if "=" in p)
              return {
                "uuid": uuid,
                "host": host,
                "port": int(port),
                "flow": params.get("flow", "xtls-rprx-vision"),
                "sni":  params.get("sni", host),
                "pbk":  params.get("pbk", ""),
                "fp":   params.get("fp", "chrome"),
                "sid":  params.get("sid", ""),
                "net":  params.get("type", "tcp"),
              }
            except Exception:
              return None

          def make_outbound(tag, p):
            return {
              "tag": tag,
              "protocol": "vless",
              "settings": {
                "vnext": [{
                  "address": p["host"],
                  "port": p["port"],
                  "users": [{"id": p["uuid"], "encryption": "none", "flow": p["flow"]}]
                }]
              },
              "streamSettings": {
                "network": p["net"],
                "tcpSettings": {},
                "security": "reality",
                "realitySettings": {
                  "serverName": p["sni"],
                  "publicKey":  p["pbk"],
                  "shortId":    p["sid"],
                  "fingerprint": p["fp"]
                }
              }
            }

          def make_config(label, outbounds, tags):
            return {
              "remarks": label,
              "dns": {"servers": ["1.1.1.1", "1.0.0.1"], "queryStrategy": "UseIP"},
              "routing": {
                "domainMatcher": "hybrid",
                "domainStrategy": "IPIfNonMatch",
                "rules": [
                  {"type": "field", "protocol": ["bittorrent"], "outboundTag": "direct"},
                  {"type": "field", "inboundTag": ["socks", "http"], "balancerTag": "AUTO-BAL"}
                ],
                "balancers": [{
                  "tag": "AUTO-BAL",
                  "selector": tags,
                  "strategy": {
                    "type": "leastPing",
                    "settings": {"maxRTT": "2000ms", "expected": 3, "baselines": ["1200ms"], "tolerance": 0.1}
                  },
                  "fallbackTag": "direct"
                }]
              },
              "inbounds": [
                {"tag": "socks", "port": 10808, "listen": "127.0.0.1", "protocol": "socks",
                 "settings": {"udp": True, "auth": "noauth"},
                 "sniffing": {"enabled": True, "routeOnly": False, "destOverride": ["http", "tls", "quic"]}},
                {"tag": "http", "port": 10809, "listen": "127.0.0.1", "protocol": "http",
                 "settings": {"allowTransparent": False},
                 "sniffing": {"enabled": True, "routeOnly": False, "destOverride": ["http", "tls", "quic"]}}
              ],
              "outbounds": outbounds + [
                {"tag": "direct", "protocol": "freedom"},
                {"tag": "block",  "protocol": "blackhole"}
              ],
              "burstObservatory": {
                "pingConfig": {
                  "timeout": "2s", "interval": "10s", "sampling": 2,
                  "httpMethod": "GET",
                  "destination": "https://www.gstatic.com/generate_204",
                  "connectivity": ""
                },
                "subjectSelector": tags
              }
            }

          # === header for vlees.txt ===
          with open(VLESS_TXT, "w") as f:
            f.write("#profile-title: HiBypass | LTE FREE\n")
            f.write("#profile-update-interval: 6\n")
            f.write("#support-url: https://t.me/Hibypass\n")
            f.write("#traffic-limit: inf\n")
            f.write("#traffic-remaining: inf\n")

          all_nodes = []   # для LTE_ALL

          for block_idx, url in enumerate(SOURCES, 1):
            print(f"--- Block {block_idx}: {url}")
            try:
              with urllib.request.urlopen(url, timeout=30) as r:
                lines = r.read().decode("utf-8", errors="ignore").splitlines()
            except Exception as e:
              print(f"    ERROR fetching: {e}")
              continue

            vless_lines = sorted(set(l.strip() for l in lines if l.strip().startswith("vless://")))
            print(f"    found: {len(vless_lines)}")
            if not vless_lines:
              continue

            # split into groups of GROUP_SIZE
            chunks = [vless_lines[i:i+GROUP_SIZE] for i in range(0, len(vless_lines), GROUP_SIZE)]

            for group_idx, chunk in enumerate(chunks, 1):
              label = f"LTE | Auto {block_idx}.{group_idx}"
              outbounds = []
              tags = []

              for node_idx, uri in enumerate(chunk, 1):
                p = parse_vless(uri)
                if not p or not p["pbk"]:
                  continue
                tag = f"n{block_idx}g{group_idx}-{node_idx}"
                outbounds.append(make_outbound(tag, p))
                tags.append(tag)
                all_nodes.append((uri, p))

              if not tags:
                continue

              cfg = make_config(label, outbounds, tags)
              fname = os.path.join(OUTPUT_DIR, f"lte_{block_idx}_{group_idx}.json")
              with open(fname, "w") as f:
                json.dump(cfg, f, ensure_ascii=False, indent=2)

              # append to vlees.txt
              with open(VLESS_TXT, "a") as f:
                for uri in chunk:
                  base = uri.split("#")[0]
                  f.write(f"{base}#{label}\n")

              print(f"    OK {fname} ({len(tags)} nodes)")

          # === LTE_ALL.json ===
          print(f"\n--- Building LTE_ALL.json ({len(all_nodes)} total nodes)")
          all_outbounds = []
          all_tags = []
          for i, (uri, p) in enumerate(all_nodes, 1):
            tag = f"all-{i}"
            all_outbounds.append(make_outbound(tag, p))
            all_tags.append(tag)

          if all_tags:
            cfg_all = make_config("LTE | Auto ALL", all_outbounds, all_tags)
            fname_all = os.path.join(OUTPUT_DIR, "LTE_ALL.json")
            with open(fname_all, "w") as f:
              json.dump(cfg_all, f, ensure_ascii=False, indent=2)
            print(f"    OK {fname_all} ({len(all_tags)} nodes)")

          total_json = len([x for x in os.listdir(OUTPUT_DIR) if x.endswith(".json")])
          print(f"\nDone! JSON files: {total_json}")
          PYEOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add configs/ vlees.txt
          git diff --staged --quiet || git commit -m "Auto: update $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
