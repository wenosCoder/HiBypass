name: Merge VLESS Configs

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  merge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          jq --version

      - name: Convert VLESS to JSON and split by 20
        run: |
          # Функция парсинга VLESS ссылки
          parse_vless() {
            local URL="$1"
            local REMARK="$2"
            
            # Убираем префикс vless://
            local CLEAN="${URL#vless://}"
            
            # Извлекаем UUID (всё до @)
            local UUID="${CLEAN%%@*}"
            local REST="${CLEAN#*@}"
            
            # Извлекаем адрес (всё до :)

            local ADDRESS="${REST%%:*}"
            local PORT_AND_QUERY="${REST#*:}"
            
            # Извлекаем порт (всё до ?)
            local PORT="${PORT_AND_QUERY%%\?*}"
            local QUERY="${PORT_AND_QUERY#*\?}"
            
            # Убираем fragment если есть
            QUERY="${QUERY%%\#*}"
            
            # Парсим параметры через sed
            local ENCRYPTION=$(echo "$QUERY" | sed -n 's/.*encryption=\([^&]*\).*/\1/p')
            local FLOW=$(echo "$QUERY" | sed -n 's/.*flow=\([^&]*\).*/\1/p')
            local SECURITY=$(echo "$QUERY" | sed -n 's/.*security=\([^&]*\).*/\1/p')
            local SNI=$(echo "$QUERY" | sed -n 's/.*sni=\([^&]*\).*/\1/p')
            local FP=$(echo "$QUERY" | sed -n 's/.*fp=\([^&]*\).*/\1/p')
            local PBK=$(echo "$QUERY" | sed -n 's/.*pbk=\([^&]*\).*/\1/p')
            
            # Значения по умолчанию
            ENCRYPTION=${ENCRYPTION:-"none"}
            FLOW=${FLOW:-"xtls-rprx-vision"}
            SECURITY=${SECURITY:-"reality"}
            SNI=${SNI:-"ads.x5.ru"}
            FP=${FP:-"chrome"}
            
            # Формируем JSON
            jq -n \
              --arg tag "proxy" \
              --arg protocol "vless" \
              --arg address "$ADDRESS" \
              --arg port "$PORT" \
              --arg id "$UUID" \
              --arg encryption "$ENCRYPTION" \
              --arg flow "$FLOW" \
              --arg security "$SECURITY" \
              --arg sni "$SNI" \
              --arg fp "$FP" \
              --arg pbk "$PBK" \
              --arg remark "$REMARK" \
              '{
                tag: $tag,
                protocol: $protocol,
                settings: {
                  vnext: [{
                    address: $address,
                    port: ($port | tonumber),
                    users: [{
                      id: $id,
                      encryption: $encryption,
                      flow: $flow
                    }]
                  }]
                },
                streamSettings: {
                  network: "tcp",
                  security: $security,
                  realitySettings: {
                    serverName: $sni,
                    publicKey: $pbk,
                    fingerprint: $fp
                  }
                }
              }'
          }

          # Создаём базовый шаблон
          cat > base_config.json << 'EOF'
          {
            "dns": {
              "servers": ["1.1.1.1", "1.0.0.1"],
              "queryStrategy": "UseIP"
            },
            "routing": {
              "rules": [
                {
                  "type": "field",
                  "protocol": ["bittorrent"],
                  "outboundTag": "direct"
                }
              ],
              "domainMatcher": "hybrid",
              "domainStrategy": "IPIfNonMatch"
            },
            "inbounds": [
              {
                "tag": "socks",
                "port": 10808,
                "listen": "127.0.0.1",
                "protocol": "socks",
                "settings": { "udp": true, "auth": "noauth" },
                "sniffing": { "enabled": true, "routeOnly": false, "destOverride": ["http", "tls", "quic"] }
              },
              {
                "tag": "http",
                "port": 10809,
                "listen": "127.0.0.1",
                "protocol": "http",
                "settings": { "allowTransparent": false },
                "sniffing": { "enabled": true, "routeOnly": false, "destOverride": ["http", "tls", "quic"] }
              }
            ],
            "outbounds": [],
            "remarks": ""
          }
          EOF

          # Функция обработки источника
          process_source() {
            local URL="$1"
            local BLOCK_NUM="$2"
            
            local CONFIGS=()
            local COUNT=0
            local BATCH=1
            
            echo "Обработка блока $BLOCK_NUM из $URL"
            
            # Скачиваем и фильтруем vless ссылки
            curl -fsSL "$URL" | grep -E '^vless://' | sort -u | while IFS= read -r line; do
              [ -z "$line" ] && continue
              
              CONFIGS+=("$line")
              COUNT=$((COUNT + 1))
              
              if [ $COUNT -eq 20 ]; then
                OUTPUT_FILE="lte_${BLOCK_NUM}_${BATCH}.json"
                cp base_config.json "$OUTPUT_FILE"
                
                # Добавляем каждый конфиг в outbounds
                for i in "${!CONFIGS[@]}"; do
                  REMARK="🇪🇺 LTE | ${BLOCK_NUM}.${BATCH} | node$((i+1))"
                  parse_vless "${CONFIGS[$i]}" "$REMARK" > /tmp/outbound.json
                  
                  # Объединяем с основным JSON
                  jq --argjson new "$(cat /tmp/outbound.json)" \
                    '.outbounds = .outbounds + [$new]' "$OUTPUT_FILE" > "$OUTPUT_FILE.tmp"
                  mv "$OUTPUT_FILE.tmp" "$OUTPUT_FILE"
                done
                
                # Обновляем remarks
                jq --arg r "🇪🇺 LTE | ${BLOCK_NUM}.${BATCH} (20 nodes)" \
                  '.remarks = $r' "$OUTPUT_FILE" > "$OUTPUT_FILE.tmp"
                mv "$OUTPUT_FILE.tmp" "$OUTPUT_FILE"
                
                echo "✅ Создан: $OUTPUT_FILE"
                
                # Сбрасываем для следующей пачки
                CONFIGS=()
                COUNT=0
                BATCH=$((BATCH + 1))
              fi
            done
            
            # Обрабатываем последнюю неполную пачку
            if [ ${#CONFIGS[@]} -gt 0 ]; then
              OUTPUT_FILE="lte_${BLOCK_NUM}_${BATCH}.json"
              cp base_config.json "$OUTPUT_FILE"
              
              for i in "${!CONFIGS[@]}"; do
                REMARK="🇪🇺 LTE | ${BLOCK_NUM}.${BATCH} | node$((i+1))"
                parse_vless "${CONFIGS[$i]}" "$REMARK" > /tmp/outbound.json
                
                jq --argjson new "$(cat /tmp/outbound.json)" \
                  '.outbounds = .outbounds + [$new]' "$OUTPUT_FILE" > "$OUTPUT_FILE.tmp"
                mv "$OUTPUT_FILE.tmp" "$OUTPUT_FILE"
              done
              
              jq --arg r "🇪🇺 LTE | ${BLOCK_NUM}.${BATCH} (${#CONFIGS[@]} nodes)" \
                '.remarks = $r' "$OUTPUT_FILE" > "$OUTPUT_FILE.tmp"
              mv "$OUTPUT_FILE.tmp" "$OUTPUT_FILE"
              
              echo "✅ Создан: $OUTPUT_FILE (${#CONFIGS[@]} конфигов)"
            fi
          }

          # Удаляем старые файлы
          rm -f lte_*.json

          # Обрабатываем все 8 источников
          process_source "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/Vless-Reality-White-Lists-Rus-Mobile-2.txt" "1"
          process_source "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/Vless-Reality-White-Lists-Rus-Mobile.txt" "2"
          process_source "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/WHITE-CIDR-RU-all.txt" "3"
          process_source "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/WHITE-CIDR-RU-checked.txt" "4"
          process_source "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/WHITE-SNI-RU-all.txt" "5"
          process_source "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/BLACK_SS%2BAll_RUS.txt" "6"
          process_source "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/BLACK_VLESS_RUS.txt" "7"
          process_source "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/BLACK_VLESS_RUS_mobile.txt" "8"

          echo ""
          echo "📊 Статистика:"
          echo "Всего создано JSON-файлов: $(ls lte_*.json 2>/dev/null | wc -l)"
          ls -la lte_*.json 2>/dev/null | head -20

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lte_*.json
          git diff --staged --quiet || git commit -m "Auto: обновление $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
