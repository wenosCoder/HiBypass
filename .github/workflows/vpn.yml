name: Merge VLESS Configs

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 55

    strategy:
      matrix:
        batch: [1, 2, 3]
      fail-fast: false

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get install -y curl jq

      - name: Fetch batch ${{ matrix.batch }}
        timeout-minutes: 50
        run: |
          SNI_ALLOWED="ads.x5.ru max.ru vk.ru yandex.com ya.ru"
          CONFIGS_TMP="batch_${{ matrix.batch }}.tmp"
          SEEN_HOSTS=$(mktemp)

          process_source() {
            local URL="$1" PREFIX="$2" TMPFILE HOST PORT HOSTPORT BASE SNI_VAL SNI_OK NET_VAL
            TMPFILE=$(mktemp)
            curl -fsSL --max-time 30 --connect-timeout 10 "$URL" > "$TMPFILE" 2>/dev/null || { rm -f "$TMPFILE"; return; }

            if ! grep -qE '^vless://' "$TMPFILE"; then
              BASE64_TMP=$(mktemp)
              base64 -d "$TMPFILE" > "$BASE64_TMP" 2>/dev/null && mv "$BASE64_TMP" "$TMPFILE" || rm -f "$BASE64_TMP"
            fi

            grep -E '^vless://' "$TMPFILE" | sort -u | while IFS= read -r line; do
              BASE=$(echo "$line" | sed 's/#.*//')
              HOST=$(echo "$BASE" | sed 's/.*@//;s/[:/].*//')

              echo "$HOST" | grep -qE '^(84|89|158|188)\.' || continue

              NET_VAL=$(echo "$BASE" | grep -o 'type=[^&]*' | cut -d= -f2)
              if [ -n "$NET_VAL" ] && [ "$NET_VAL" != "tcp" ]; then
                continue
              fi

              SNI_VAL=$(echo "$BASE" | grep -o 'sni=[^&]*' | cut -d= -f2)
              SNI_OK=0
              for ALLOWED in $SNI_ALLOWED; do
                [ "$SNI_VAL" = "$ALLOWED" ] && SNI_OK=1 && break
              done
              [ "$SNI_OK" -eq 1 ] || continue

              PORT=$(echo "$BASE" | sed 's/.*@[^:]*://;s/[/?].*//')
              HOSTPORT="${HOST}:${PORT}"
              grep -qF "$HOSTPORT" "$SEEN_HOSTS" 2>/dev/null && continue

              printf '%s\t%s\t%s\t%s\n' "$BASE" "$HOST" "$PORT" "$PREFIX" >> "$CONFIGS_TMP"
              echo "$HOSTPORT" >> "$SEEN_HOSTS"
            done
            rm -f "$TMPFILE"
          }

          if [ "${{ matrix.batch }}" = "1" ]; then
            process_source "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/Vless-Reality-White-Lists-Rus-Mobile-2.txt" "1"
            process_source "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/Vless-Reality-White-Lists-Rus-Mobile.txt" "2"
            process_source "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/WHITE-CIDR-RU-all.txt" "3"
            process_source "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/WHITE-CIDR-RU-checked.txt" "4"
            process_source "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/WHITE-SNI-RU-all.txt" "5"
            process_source "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/BLACK_SS%2BAll_RUS.txt" "6"
            process_source "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/BLACK_VLESS_RUS.txt" "7"
            process_source "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/BLACK_VLESS_RUS_mobile.txt" "8"
            process_source "https://raw.githubusercontent.com/zieng2/wl/refs/heads/main/vless_universal.txt" "9"
            process_source "https://raw.githubusercontent.com/zieng2/wl/refs/heads/main/vless_lite.txt" "10"
            process_source "https://raw.githubusercontent.com/whoahaow/rjsxrd/refs/heads/main/githubmirror/bypass/bypass-all.txt" "11"
            process_source "https://raw.githubusercontent.com/whoahaow/rjsxrd/refs/heads/main/githubmirror/bypass-unsecure/bypass-unsecure-all.txt" "12"
            process_source "https://raw.githubusercontent.com/whoahaow/rjsxrd/refs/heads/main/githubmirror/split-by-protocols/vless-secure.txt" "13"
            process_source "https://raw.githubusercontent.com/whoahaow/rjsxrd/refs/heads/main/githubmirror/split-by-protocols/vless.txt" "14"
            process_source "https://sub.obbhod.online/premium" "41"
            process_source "https://mifa.world/vless" "42"
            process_source "https://raw.githubusercontent.com/Temnuk/naabuzil/refs/heads/main/whitelist_full" "43"
          fi

          if [ "${{ matrix.batch }}" = "2" ]; then
            process_source "https://raw.githubusercontent.com/VOID-Anonymity/V.O.I.D-VPN_Bypass/refs/heads/main/url_work.txt" "15"
            process_source "https://github.com/sakha1370/OpenRay/raw/refs/heads/main/output/all_valid_proxies.txt" "16"
            process_source "https://raw.githubusercontent.com/sevcator/5ubscrpt10n/main/protocols/vl.txt" "17"
            process_source "https://raw.githubusercontent.com/yitong2333/proxy-minging/refs/heads/main/v2ray.txt" "18"
            process_source "https://raw.githubusercontent.com/acymz/AutoVPN/refs/heads/main/data/V2.txt" "19"
            process_source "https://raw.githubusercontent.com/miladtahanian/V2RayCFGDumper/refs/heads/main/sub.txt" "20"
            process_source "https://raw.githubusercontent.com/roosterkid/openproxylist/main/V2RAY_RAW.txt" "21"
            process_source "https://github.com/Epodonios/v2ray-configs/raw/main/Splitted-By-Protocol/trojan.txt" "22"
            process_source "https://raw.githubusercontent.com/CidVpn/cid-vpn-config/refs/heads/main/general.txt" "23"
            process_source "https://raw.githubusercontent.com/mohamadfg-dev/telegram-v2ray-configs-collector/refs/heads/main/category/vless.txt" "24"
            process_source "https://raw.githubusercontent.com/mheidari98/.proxy/refs/heads/main/vless" "25"
            process_source "https://raw.githubusercontent.com/youfoundamin/V2rayCollector/main/mixed_iran.txt" "26"
            process_source "https://raw.githubusercontent.com/MahsaNetConfigTopic/config/refs/heads/main/xray_final.txt" "27"
          fi

          if [ "${{ matrix.batch }}" = "3" ]; then
            process_source "https://github.com/LalatinaHub/Mineral/raw/refs/heads/master/result/nodes" "28"
            process_source "https://raw.githubusercontent.com/miladtahanian/Config-Collector/refs/heads/main/mixed_iran.txt" "29"
            process_source "https://raw.githubusercontent.com/Pawdroid/Free-servers/refs/heads/main/sub" "30"
            process_source "https://github.com/MhdiTaheri/V2rayCollector_Py/raw/refs/heads/main/sub/Mix/mix.txt" "31"
            process_source "https://raw.githubusercontent.com/free18/v2ray/refs/heads/main/v.txt" "32"
            process_source "https://github.com/MhdiTaheri/V2rayCollector/raw/refs/heads/main/sub/mix" "33"
            process_source "https://github.com/Argh94/Proxy-List/raw/refs/heads/main/All_Config.txt" "34"
            process_source "https://raw.githubusercontent.com/shabane/kamaji/master/hub/merged.txt" "35"
            process_source "https://raw.githubusercontent.com/wuqb2i4f/xray-config-toolkit/main/output/base64/mix-uri" "36"
            process_source "https://github.com/Mr-Meshky/vify/raw/refs/heads/main/configs/vless.txt" "37"
            process_source "https://raw.githubusercontent.com/V2RayRoot/V2RayConfig/refs/heads/main/Config/vless.txt" "38"
            process_source "https://raw.githubusercontent.com/AvenCores/goida-vpn-configs/refs/heads/main/githubmirror/26.txt" "39"
            process_source "https://raw.githubusercontent.com/whoahaow/rjsxrd/refs/heads/main/githubmirror/bypass/raw/bypass-all-raw.txt" "40"
          fi

      - name: Upload batch artifact
        uses: actions/upload-artifact@v4
        with:
          name: batch-${{ matrix.batch }}
          path: batch_${{ matrix.batch }}.tmp
          retention-days: 1

  merge:
    needs: fetch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get install -y jq

      - name: Download all batches
        uses: actions/download-artifact@v4
        with:
          pattern: batch-*
          merge-multiple: true

      - name: Merge and generate files
        run: |
          # ── vlees.txt ──────────────────────────────────────────────────────
          printf '%s\n' \
            '#profile-title: HiBypass | LTE FREE 🏳🇷🇺' \
            '#profile-update-interval: 1' \
            '#support-url: https://t.me/Hibypass' \
            '#profile-web-page-url: https://t.me/Hibypass' \
            '#announce: Бесплатный обход белых списков РФ 🏳🇷🇺 | ТГ : @Hibypass' \
            '#traffic-limit: ∞' \
            '#traffic-remaining: ∞' \
            > vlees.txt

          # ── дедупликация ───────────────────────────────────────────────────
          MERGED_TMP=$(mktemp)
          cat batch_*.tmp 2>/dev/null > "$MERGED_TMP"

          DEDUP_TMP=$(mktemp)
          SEEN=$(mktemp)
          while IFS=$'\t' read -r BASE HOST PORT PREFIX; do
            HOSTPORT="${HOST}:${PORT}"
            grep -qF "$HOSTPORT" "$SEEN" && continue
            echo "$HOSTPORT" >> "$SEEN"
            printf '%s\t%s\t%s\t%s\n' "$BASE" "$HOST" "$PORT" "$PREFIX" >> "$DEDUP_TMP"
          done < "$MERGED_TMP"

          TOTAL=$(wc -l < "$DEDUP_TMP")
          echo "Всего уникальных TCP конфигов: $TOTAL"

          # ── vlees.txt ──────────────────────────────────────────────────────
          IDX=1
          while IFS=$'\t' read -r BASE HOST PORT PREFIX; do
            echo "${BASE}#🇪🇺LTE | ${IDX} 🌐 RU" >> vlees.txt
            IDX=$((IDX + 1))
          done < "$DEDUP_TMP"

          # ── Генерация всех outbounds в один tmp файл ───────────────────────
          ALL_OUTBOUNDS=$(mktemp)
          IDX=1

          while IFS=$'\t' read -r BASE HOST PORT PREFIX; do
            UUID=$(echo "$BASE" | sed 's/vless:\/\///;s/@.*//')
            QUERY=$(echo "$BASE" | grep -o '?[^#]*' | tr '?&' '\n\n')
            get_param() { echo "$QUERY" | grep "^${1}=" | head -1 | cut -d= -f2-; }

            FLOW=$(get_param flow)
            SNI=$(get_param sni)
            PBK=$(get_param pbk)
            FP=$(get_param fp)
            SID=$(get_param sid)
            SEC=$(get_param security)

            [ -z "$FP" ]   && FP="chrome"
            [ -z "$SEC" ]  && SEC="reality"
            [ -z "$FLOW" ] && FLOW="xtls-rprx-vision"
            [ -z "$SID" ]  && SID=""

            echo "$PORT" | grep -qE '^[0-9]+$' || { IDX=$((IDX + 1)); continue; }

            jq -cn \
              --arg  tag  "lte-${IDX}" \
              --arg  addr "$HOST"      \
              --argjson port "$PORT"   \
              --arg  uuid "$UUID"      \
              --arg  flow "$FLOW"      \
              --arg  sec  "$SEC"       \
              --arg  sni  "$SNI"       \
              --arg  pbk  "$PBK"       \
              --arg  fp   "$FP"        \
              --arg  sid  "$SID"       \
              '{
                tag: $tag,
                protocol: "vless",
                settings: {
                  vnext: [{
                    address: $addr,
                    port: $port,
                    users: [{id: $uuid, encryption: "none", flow: $flow}]
                  }]
                },
                streamSettings: {
                  network: "tcp",
                  security: $sec,
                  realitySettings: {
                    serverName: $sni,
                    publicKey: $pbk,
                    shortId: $sid,
                    fingerprint: $fp
                  }
                }
              }' >> "$ALL_OUTBOUNDS"

            IDX=$((IDX + 1))
          done < "$DEDUP_TMP"

          CONF_COUNT=$((IDX - 1))
          echo "Сгенерировано outbounds: $CONF_COUNT"

          # ── Разбивка на паки по 50, всё в один packs.json ─────────────────
          PACK_SIZE=50
          PACK_NUM=1
          CHUNK=$(mktemp)
          LINE_COUNT=0
          PACKS_ARRAY=$(mktemp)
          echo "[]" > "$PACKS_ARRAY"

          make_pack() {
            local num="$1" chunk="$2"
            jq -n \
              --arg remarks "🇪🇺LTE | 1.${num} 🌐" \
              --slurpfile out "$chunk" \
              '{
                remarks: $remarks,

                dns: {
                  servers: ["1.1.1.1", "1.0.0.1"],
                  queryStrategy: "UseIP"
                },

                observatory: {
                  enableConcurrency: true,
                  probeInterval: "30s",
                  probeUrl: "http://www.gstatic.com/generate_204",
                  subjectSelector: ["lte-"]
                },

                routing: {
                  domainMatcher: "hybrid",
                  domainStrategy: "IPIfNonMatch",
                  rules: [
                    {
                      type: "field",
                      protocol: ["bittorrent"],
                      outboundTag: "direct"
                    },
                    {
                      type: "field",
                      inboundTag: ["socks", "http"],
                      balancerTag: "BALANCER"
                    }
                  ],
                  balancers: [{
                    tag: "BALANCER",
                    selector: ["lte-"],
                    strategy: {type: "leastPing"}
                  }]
                },

                inbounds: [
                  {
                    tag: "socks",
                    port: 10808,
                    listen: "127.0.0.1",
                    protocol: "socks",
                    settings: {udp: true, auth: "noauth"},
                    sniffing: {
                      enabled: true,
                      routeOnly: false,
                      destOverride: ["http", "tls", "quic"]
                    }
                  },
                  {
                    tag: "http",
                    port: 10809,
                    listen: "127.0.0.1",
                    protocol: "http",
                    settings: {allowTransparent: false},
                    sniffing: {
                      enabled: true,
                      routeOnly: false,
                      destOverride: ["http", "tls", "quic"]
                    }
                  }
                ],

                outbounds: ($out + [
                  {tag: "direct", protocol: "freedom"},
                  {tag: "block",  protocol: "blackhole"}
                ])
              }'
          }

          while IFS= read -r line; do
            echo "$line" >> "$CHUNK"
            LINE_COUNT=$((LINE_COUNT + 1))

            if [ "$LINE_COUNT" -eq "$PACK_SIZE" ]; then
              PACK_JSON=$(make_pack "$PACK_NUM" "$CHUNK")
              TMP_ARRAY=$(mktemp)
              jq --argjson pack "$PACK_JSON" '. + [$pack]' "$PACKS_ARRAY" > "$TMP_ARRAY"
              mv "$TMP_ARRAY" "$PACKS_ARRAY"
              echo "✅ Пак 1.${PACK_NUM} добавлен (50 серверов)"
              PACK_NUM=$((PACK_NUM + 1))
              rm -f "$CHUNK"
              CHUNK=$(mktemp)
              LINE_COUNT=0
            fi
          done < "$ALL_OUTBOUNDS"

          # Остаток
          if [ "$LINE_COUNT" -gt 0 ]; then
            PACK_JSON=$(make_pack "$PACK_NUM" "$CHUNK")
            TMP_ARRAY=$(mktemp)
            jq --argjson pack "$PACK_JSON" '. + [$pack]' "$PACKS_ARRAY" > "$TMP_ARRAY"
            mv "$TMP_ARRAY" "$PACKS_ARRAY"
            echo "✅ Пак 1.${PACK_NUM} добавлен ($LINE_COUNT серверов)"
          fi

          mv "$PACKS_ARRAY" packs.json

          rm -f "$CHUNK" "$MERGED_TMP" "$DEDUP_TMP" "$SEEN" "$ALL_OUTBOUNDS"
          PACK_TOTAL=$((PACK_NUM))
          echo "✅ Готово: $CONF_COUNT серверов в $PACK_TOTAL паках — один packs.json"

      - name: Validate JSON
        run: |
          if jq empty packs.json 2>/dev/null; then
            PACK_COUNT=$(jq 'length' packs.json)
            SERVER_COUNT=$(jq '[.[].outbounds[]|select(.tag|startswith("lte-"))]|length' packs.json)
            echo "✅ packs.json валидный | $PACK_COUNT паков | $SERVER_COUNT серверов"
          else
            echo "❌ packs.json невалидный!"
            exit 1
          fi

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add vlees.txt packs.json
          SERVER_COUNT=$(jq '[.[].outbounds[]|select(.tag|startswith("lte-"))]|length' packs.json)
          PACK_COUNT=$(jq 'length' packs.json)
          git diff --staged --quiet || git commit -m "Auto: $(date -u '+%Y-%m-%d %H:%M UTC') | $SERVER_COUNT серверов | $PACK_COUNT паков"
          git push
