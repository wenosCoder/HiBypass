name: Merge VLESS Configs

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch configs
        run: |
          echo '#profile-title: HiBypass | LTE FREE' > vlees.txt
          echo '#profile-update-interval: 6' >> vlees.txt
          echo '#support-url: https://t.me/Hibypass' >> vlees.txt
          echo '#profile-web-page-url: https://t.me/Hibypass' >> vlees.txt
          echo '#announce: Besplatnyy obkhod | TG: @Hibypass' >> vlees.txt

          fetch() {
            curl -fsSL "$1" | grep -E '^vless://' | sort -u | awk -v p="$2" 'BEGIN{c=1}{sub(/#.*/,""); print $0 "#LTE | " p "." c; c++}'
          }

          fetch "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/Vless-Reality-White-Lists-Rus-Mobile-2.txt" "1" >> vlees.txt
          fetch "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/Vless-Reality-White-Lists-Rus-Mobile.txt" "2" >> vlees.txt
          fetch "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/WHITE-CIDR-RU-all.txt" "3" >> vlees.txt
          fetch "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/WHITE-CIDR-RU-checked.txt" "4" >> vlees.txt
          fetch "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/WHITE-SNI-RU-all.txt" "5" >> vlees.txt
          fetch "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/BLACK_SS%2BAll_RUS.txt" "6" >> vlees.txt
          fetch "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/BLACK_VLESS_RUS.txt" "7" >> vlees.txt
          fetch "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/BLACK_VLESS_RUS_mobile.txt" "8" >> vlees.txt

          echo "vlees.txt: $(wc -l < vlees.txt) lines"

      - name: Generate config.json
        run: |
          rm -f outbounds.txt selectors.txt
          N=1

          while IFS= read -r line; do
            [[ "$line" =~ ^vless:// ]] || continue
            UUID=$(echo "$line" | grep -oP '(?<=vless://)[^@]+' || true)
            HOST=$(echo "$line" | grep -oP '(?<=@)[^:]+' || true)
            PORT=$(echo "$line" | grep -oP '(?<=:)\d+(?=\?)' | head -1 || true)
            SNI=$(echo "$line" | grep -oP '(?<=sni=)[^&]+' | head -1 || true)
            PBK=$(echo "$line" | grep -oP '(?<=pbk=)[^&]+' | head -1 || true)
            SID=$(echo "$line" | grep -oP '(?<=sid=)[^&]+' | head -1 || true)
            [ -z "$UUID" ] && continue
            [ -z "$HOST" ] && continue
            [ -z "$PORT" ] && continue
            [ -z "$SNI" ] && SNI="$HOST"
            TAG="s${N}"
            echo "{\"tag\":\"$TAG\",\"protocol\":\"vless\",\"settings\":{\"vnext\":[{\"address\":\"$HOST\",\"port\":$PORT,\"users\":[{\"id\":\"$UUID\",\"encryption\":\"none\",\"flow\":\"xtls-rprx-vision\"}]}]},\"streamSettings\":{\"network\":\"tcp\",\"security\":\"reality\",\"realitySettings\":{\"serverName\":\"$SNI\",\"publicKey\":\"$PBK\",\"shortId\":\"$SID\",\"fingerprint\":\"chrome\"}}}" >> outbounds.txt
            echo "\"$TAG\"" >> selectors.txt
            N=$((N+1))
          done < vlees.txt

          OUTBOUNDS=$(paste -sd ',' outbounds.txt)
          SELECTORS=$(paste -sd ',' selectors.txt)

          echo "{\"remarks\":\"HiBypass | LTE AUTO\",\"dns\":{\"servers\":[\"1.1.1.1\",\"1.0.0.1\"]},\"routing\":{\"domainStrategy\":\"IPIfNonMatch\",\"rules\":[{\"type\":\"field\",\"protocol\":[\"bittorrent\"],\"outboundTag\":\"direct\"},{\"type\":\"field\",\"inboundTag\":[\"socks\",\"http\"],\"balancerTag\":\"auto\"}],\"balancers\":[{\"tag\":\"auto\",\"selector\":[$SELECTORS],\"strategy\":{\"type\":\"leastPing\"}}]},\"inbounds\":[{\"tag\":\"socks\",\"port\":10808,\"listen\":\"127.0.0.1\",\"protocol\":\"socks\",\"settings\":{\"udp\":true}},{\"tag\":\"http\",\"port\":10809,\"listen\":\"127.0.0.1\",\"protocol\":\"http\"}],\"outbounds\":[$OUTBOUNDS,{\"tag\":\"direct\",\"protocol\":\"freedom\"},{\"tag\":\"block\",\"protocol\":\"blackhole\"}],\"burstObservatory\":{\"pingConfig\":{\"timeout\":\"2s\",\"interval\":\"10s\",\"sampling\":2,\"destination\":\"https://www.gstatic.com/generate_204\"},\"subjectSelector\":[$SELECTORS]}}" > config.json

          echo "config.json: done, $((N-1)) servers"

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add vlees.txt config.json
          git diff --staged --quiet || git commit -m "Auto update $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
