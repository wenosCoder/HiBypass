name: Build V2Ray AUTO Config

on:
schedule:
- cron: '0 */6 * * *'
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Install jq
    run: sudo apt-get update && sudo apt-get install -y jq

  - name: Fetch VLESS sources
    run: |
      SOURCES=(
        "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/Vless-Reality-White-Lists-Rus-Mobile-2.txt"
        "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/Vless-Reality-White-Lists-Rus-Mobile.txt"
        "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/WHITE-CIDR-RU-all.txt"
        "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/WHITE-CIDR-RU-checked.txt"
      )

      > raw.txt
      for URL in "${SOURCES[@]}"; do
        curl -fsSL "$URL" | grep '^vless://' >> raw.txt
      done

      sort -u raw.txt > unique.txt
      echo "Найдено конфигов: $(wc -l < unique.txt)"

  - name: Build outbounds.json
    run: |
      echo "[]" > outbounds.json

      while read -r line; do
        BASE=$(echo "$line" | sed 's/#.*//')

        UUID=$(echo "$BASE" | sed -n 's|vless://[^@]*@.*|\1|p')
        HOST=$(echo "$BASE" | sed -n 's|vless://[^@]*@[^:]*:.*|\1|p')
        PORT=$(echo "$BASE" | sed -n 's|.*:[0-9]*?.*|\1|p')

        SNI=$(echo "$BASE" | grep -o 'sni=[^&]*' | cut -d= -f2)
        PBK=$(echo "$BASE" | grep -o 'pbk=[^&]*' | cut -d= -f2)
        SID=$(echo "$BASE" | grep -o 'sid=[^&]*' | cut -d= -f2)

        [ -z "$SNI" ] && SNI="$HOST"

        # пропуск если нет ключа (важно)
        if [ -z "$PBK" ]; then
          continue
        fi

        jq --arg host "$HOST" \
           --arg port "$PORT" \
           --arg uuid "$UUID" \
           --arg sni "$SNI" \
           --arg pbk "$PBK" \
           --arg sid "$SID" \
           '. += [{
             "tag": "cheap",
             "protocol": "vless",
             "settings": {
               "vnext": [{
                 "address": $host,
                 "port": ($port|tonumber),
                 "users": [{
                   "id": $uuid,
                   "encryption": "none",
                   "flow": "xtls-rprx-vision"
                 }]
               }]
             },
             "streamSettings": {
               "network": "tcp",
               "security": "reality",
               "realitySettings": {
                 "serverName": $sni,
                 "publicKey": $pbk,
                 "shortId": $sid,
                 "fingerprint": "chrome"
               }
             }
           }]' outbounds.json > tmp.json && mv tmp.json outbounds.json

      done < unique.txt

      echo "Собрано outbounds: $(jq length outbounds.json)"

  - name: Build final config.json
    run: |
      jq -n \
      --slurpfile outs outbounds.json \
      '{
        "log": { "loglevel": "warning" },

        "inbounds": [{
          "tag": "socks",
          "port": 10808,
          "listen": "127.0.0.1",
          "protocol": "socks",
          "settings": { "udp": true }
        }],

        "outbounds": (
          $outs[0] + [
            { "tag": "direct", "protocol": "freedom" }
          ]
        ),

        "routing": {
          "rules": [{
            "type": "field",
            "balancerTag": "AUTO"
          }],
          "balancers": [{
            "tag": "AUTO",
            "selector": ["cheap"],
            "strategy": {
              "type": "leastPing"
            }
          }]
        },

        "burstObservatory": {
          "pingConfig": {
            "destination": "http://connectivitycheck.gstatic.com/generate_204",
            "interval": "5s",
            "timeout": "1s"
          },
          "subjectSelector": ["cheap"]
        },

        "remarks": "💎 AUTO VLESS ⚡"
      }' > config.json

      echo "Финальный config.json готов"

  - name: Commit & push
    run: |
      git config user.name "github-actions"
      git config user.email "actions@github.com"
      git add config.json
      git commit -m "AUTO config $(date -u)" || echo "no changes"
      git push
