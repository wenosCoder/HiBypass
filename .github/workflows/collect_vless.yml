name: Collect VLESS Configs

on:
  schedule:
    - cron: '0 */2 * * *'   # каждые 2 часа
  workflow_dispatch:          # ручной запуск

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests

      - name: Run collector
        run: python scripts/collect_vless.py

      - name: Commit & push bb.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bb.json
          git diff --cached --quiet || git commit -m "🔄 Auto-update bb.json [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          git push
