name: Collect VLESS Configs

on:
  schedule:
    - cron: '0 */2 * * *'   # каждые 2 часа
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run collector
        timeout-minutes: 25
        run: python scripts/collect_vlees.py

      - name: Validate bb.json
        run: |
          python3 -c "
          import json, sys
          try:
              with open('bb.json') as f:
                  data = json.load(f)
              packs = len(data) if isinstance(data, list) else 1
              print(f'✅ bb.json валидный | паков: {packs}')
          except Exception as e:
              print(f'❌ bb.json невалидный: {e}')
              sys.exit(1)
          "

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bb.json vlees.txt || true
          COUNT=$(python3 -c "
          import json
          data = json.load(open('bb.json'))
          total = sum(
              sum(1 for o in p.get('outbounds',[]) if o.get('tag','').startswith('lte-'))
              for p in data
          )
          print(total)
          " 2>/dev/null || echo "?")
          PACKS=$(python3 -c "import json; print(len(json.load(open('bb.json'))))" 2>/dev/null || echo "?")
          git diff --staged --quiet || \
            git commit -m "Auto: $(date -u '+%Y-%m-%d %H:%M UTC') | серверов: $COUNT | паков: $PACKS"
          git push
