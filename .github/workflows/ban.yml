name: Merge VLESS Configs

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  merge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch and merge VLESS configs
        run: |
          cat > vlees.txt << 'EOF'
#profile-title: HiBypass | LTE FREE 🏳🇷🇺
#profile-update-interval: 6
#support-url: https://t.me/Hibypass
#profile-web-page-url: https://t.me/Hibypass
#announce: Бесплатный обход белых списков РФ 🏳🇷🇺 | ТГ : @Hibypass
EOF

          process_source() {
            local URL="$1"
            local PREFIX="$2"
            local COUNTER=1
            curl -fsSL "$URL" | grep -E '^vless://' | sort -u | while IFS= read -r line; do
              BASE=$(echo "$line" | sed 's/#.*//')
              echo "${BASE}#🇪🇺LTE | ${PREFIX}.${COUNTER}"
              COUNTER=$((COUNTER + 1))
            done
          }

          process_source "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/Vless-Reality-White-Lists-Rus-Mobile-2.txt" "1" >> vlees.txt
          process_source "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/Vless-Reality-White-Lists-Rus-Mobile.txt" "2" >> vlees.txt
          process_source "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/WHITE-CIDR-RU-all.txt" "3" >> vlees.txt
          process_source "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/WHITE-CIDR-RU-checked.txt" "4" >> vlees.txt
          process_source "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/WHITE-SNI-RU-all.txt" "5" >> vlees.txt
          process_source "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/BLACK_SS%2BAll_RUS.txt" "6" >> vlees.txt
          process_source "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/BLACK_VLESS_RUS.txt" "7" >> vlees.txt
          process_source "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/BLACK_VLESS_RUS_mobile.txt" "8" >> vlees.txt

      - name: Generate v2rayNG config
        run: |
          # Собираем все серверы в JSON массив
          OUTBOUNDS="[]"
          SELECTORS="[]"
          COUNTER=1

          while IFS= read -r line; do
            [[ "$line" =~ ^vless:// ]] || continue
            
            # Парсим vless URL
            UUID=$(echo "$line" | grep -oP '(?<=vless://)[^@]+')
            HOST=$(echo "$line" | grep -oP '(?<=@)[^:]+')
            PORT=$(echo "$line" | grep -oP '(?<=:)\d+(?=\?)')
            SNI=$(echo "$line" | grep -oP '(?<=sni=)[^&]+' | head -1)
            PBK=$(echo "$line" | grep -oP '(?<=pbk=)[^&]+' | head -1)
            SID=$(echo "$line" | grep -oP '(?<=sid=)[^&]+' | head -1)
            TAG="server-${COUNTER}"

            [ -z "$SNI" ] && SNI="$HOST"

            OUTBOUND=$(cat << ENDJSON
          {
            "tag": "$TAG",
            "protocol": "vless",
            "settings": {
              "vnext": [{
                "address": "$HOST",
                "port": $PORT,
                "users": [{
                  "id": "$UUID",
                  "encryption": "none",
                  "flow": "xtls-rprx-vision"
                }]
              }]
            },
            "streamSettings": {
              "network": "tcp",
              "security": "reality",
              "realitySettings": {
                "serverName": "$SNI",
                "publicKey": "$PBK",
                "shortId": "$SID",
                "fingerprint": "chrome"
              }
            }
          }
          ENDJSON
          )

            echo "$OUTBOUND" >> outbounds_temp.json
            echo "$TAG" >> selectors_temp.txt
            COUNTER=$((COUNTER + 1))
          done < vlees.txt

          # Собираем финальный config.json
          OUTBOUNDS_JSON=$(cat outbounds_temp.json | tr '\n' ' ')
          SELECTORS_JSON=$(cat selectors_temp.txt | sed 's/.*/"&"/' | paste -sd ',' -)

          cat > config.json << ENDJSON
          {
            "remarks": "HiBypass | LTE AUTO 🏳🇷🇺",
            "dns": {
              "servers": ["1.1.1.1", "1.0.0.1"]
            },
            "routing": {
              "domainStrategy": "IPIfNonMatch",
              "rules": [
                {
                  "type": "field",
                  "protocol": ["bittorrent"],
                  "outboundTag": "direct"
                },
                {
                  "type": "field",
                  "inboundTag": ["socks", "http"],
                  "balancerTag": "auto"
                }
              ],
              "balancers": [
                {
                  "tag": "auto",
                  "selector": [$SELECTORS_JSON],
                  "strategy": {
                    "type": "leastPing"
                  }
                }
              ]
            },
            "inbounds": [
              {
                "tag": "socks",
                "port": 10808,
                "listen": "127.0.0.1",
                "protocol": "socks",
                "settings": {"udp": true}
              },
              {
                "tag": "http",
                "port": 10809,
                "listen": "127.0.0.1",
                "protocol": "http"
              }
            ],
            "outbounds": [
              $OUTBOUNDS_JSON,
              {"tag": "direct", "protocol": "freedom"},
              {"tag": "block", "protocol": "blackhole"}
            ],
            "burstObservatory": {
              "pingConfig": {
                "timeout": "2s",
                "interval": "10s",
                "sampling": 2,
                "destination": "https://www.gstatic.com/generate_204"
              },
              "subjectSelector": [$SELECTORS_JSON]
            }
          }
          ENDJSON

          echo "config.json готов"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add vlees.txt config.json
          git diff --staged --quiet || git commit -m "Auto: обновление $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
